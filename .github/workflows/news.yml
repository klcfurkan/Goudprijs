name: Nieuws ophalen

# Ketting: elke run haalt nieuws op, wacht 10 minuten en start dan de volgende run.
# Het schema is een reserve die de ketting opnieuw start als die ooit stopt.
on:
  schedule:
    - cron: "4,34 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Nieuws ophalen en filteren
        run: python3 scripts/news.py /tmp/news.json
      - name: Publiceren op de data-branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/data && cd /tmp/data
          git init -q -b data
          cp /tmp/news.json .
          git add news.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Nieuws bijwerken"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" data
      - name: Wachten en de volgende run starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 600
          gh workflow run news.yml --repo "${{ github.repository }}" --ref main
