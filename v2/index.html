<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairvio · Goud, eerlijk uitgelegd</title>
<meta name="description" content="Live goudprijs, wat je goud waard is, de goedkoopste manier om goud te bezitten en de belastingregels. Prototype.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#16181d; --soft:#3d424b; --muted:#6b7280; --rule:#e4e1d8;
  --gold:#b8860b; --gold-2:#e8b830; --gold-bg:#fbf3dd; --up:#0f8a4f; --down:#c62a47; --focus:#2563eb;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0e0f12; --card:#16181d; --ink:#f3f4f6; --soft:#d1d5db; --muted:#9ca3af; --rule:#2a2d34;
         --gold:#e8b830; --gold-2:#e8b830; --gold-bg:#2a2410; --up:#31d17f; --down:#ff6b85; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0e0f12; --card:#16181d; --ink:#f3f4f6; --soft:#d1d5db; --muted:#9ca3af; --rule:#2a2d34;
         --gold:#e8b830; --gold-2:#e8b830; --gold-bg:#2a2410; --up:#31d17f; --down:#ff6b85; color-scheme:dark; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--gold);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:12.5px}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4vw,36px);font-weight:700}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:-2px}
.sel{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;background:var(--card);padding:2px}
.seg button{font:600 12.5px var(--font);border:0;background:transparent;color:var(--soft);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.sel{flex-wrap:wrap}
@media (max-width:520px){.seg button{padding:6px 8px}.cc{display:none}.sel{width:100%;justify-content:space-between}}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--soft);font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px}
nav.tabs a[aria-current="page"]{background:var(--gold-bg);color:var(--ink)}

main.wrap{padding-top:28px;padding-bottom:64px;display:flex;flex-direction:column;gap:28px}
section.view{display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-direction:column;gap:6px}
.head p{color:var(--soft);max-width:70ch}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px;min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:640px){.g2{grid-template-columns:1fr}}

/* stats */
.stat{display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:600 clamp(20px,2.6vw,26px) var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .s{font-size:13px;color:var(--muted)}
.stat.hero{grid-column:span 2;gap:6px}
.stat.hero .v{font-size:clamp(34px,6vw,54px);color:var(--ink)}
.herohead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;align-items:flex-start}
button.tile:hover{border-color:var(--gold-2)}
button.tile .s b{color:var(--gold)}
.up{color:var(--up)} .down{color:var(--down)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--rule)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.open .dot{background:var(--up)} .pill.closed .dot{background:var(--down)} .pill.err .dot{background:var(--down)}
.statusrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* chart */
.chartbox{position:relative;height:340px;touch-action:pan-y;cursor:crosshair;user-select:none}
.chartbox canvas{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:640px){.chartbox{height:260px}}
.chartnow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.chartnow .num{font-size:26px;font-weight:600}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.perf{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:14px}
.perf div{background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.perf span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf b{font:600 15px var(--mono);white-space:nowrap}
.perf small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){.perf{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:480px){.perf{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tip b{font-family:var(--mono)} .tip small{display:block;opacity:.75;font-size:11.5px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 14px));box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:2}
.charthead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chartmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}

/* forms */
label{font-size:13.5px;font-weight:600;color:var(--soft);display:flex;flex-direction:column;gap:6px;min-width:0}
input,select{font:500 15px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input.num{font-family:var(--mono)}
.btn{font:600 14px var(--font);border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.icon{padding:8px 10px;line-height:1}
.row{display:grid;gap:10px;align-items:end}
.vrow{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto}
@media (max-width:640px){.vrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.vrow .out{grid-column:1}.vrow .rm{grid-column:2;justify-self:end}}
.out{font:600 16px var(--mono);padding:10px 0;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:14px;margin-top:6px}
.total .big{font:700 clamp(24px,3.4vw,32px) var(--mono)}
.note{border-left:3px solid var(--gold-2);background:var(--gold-bg);padding:10px 14px;border-radius:0 10px 10px 0;color:var(--soft);font-size:14.5px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

/* cost bars */
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) auto;gap:12px;align-items:center}
@media (max-width:640px){.brow{grid-template-columns:1fr auto}.brow .track{grid-column:1/-1;order:3}}
.brow .lbl b{display:block;font-size:15px}
.brow .lbl span{font-size:13px;color:var(--muted)}
.track{height:12px;background:var(--bg);border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--gold-2);border-radius:999px}
.brow.best .track i{background:var(--up)}
.brow .val{text-align:right;font:600 15px var(--mono);white-space:nowrap}
.brow .val small{display:block;font:500 12px var(--font);color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gold-bg);color:var(--ink);margin-left:6px;vertical-align:2px}
.tag.best{background:color-mix(in srgb,var(--up) 18%,transparent)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;background:color-mix(in srgb,var(--bg) 60%,var(--card))}
td.r,th.r{text-align:right;white-space:nowrap}
.assume table{min-width:640px}
.assume input{padding:6px 8px;font-size:14px;width:84px}
details summary{cursor:pointer;font-weight:600;color:var(--soft)}
details[open] summary{margin-bottom:12px}

/* result box */
.result{display:flex;flex-direction:column;gap:8px}
.verdict{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right}

/* news */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--font);border:1px solid var(--rule);background:var(--card);color:var(--soft);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.news{display:flex;flex-direction:column}
.news a{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.news a:last-child{border-bottom:0}
.news a b{font-weight:600;font-size:15.5px}
.news .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.cat{font-weight:700;color:var(--gold)}

.gauge{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--up) 0%,var(--up) 16%,var(--gold-2) 16%,var(--gold-2) 40%,var(--down) 40%,var(--down) 100%);opacity:.85;margin-top:6px}
.gauge i{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-50%);transition:left .3s}
.gscale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.verdict.mid{color:var(--gold)}
@media (max-width:560px){.hide-sm{display:none}}
.faq details{border-bottom:1px solid var(--rule);padding:12px 0}.faq details:last-child{border-bottom:0}.faq summary{font-size:15.5px;color:var(--ink)}.faq p{color:var(--soft);margin-top:8px;max-width:75ch}
.links{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.links a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px}
.links a:hover{border-color:var(--gold-2)}
.links a span{color:var(--muted);font-size:14px}
.dealers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.dealers ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
footer.wrap{border-top:1px solid var(--rule);padding-top:24px;padding-bottom:40px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#home">
        <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#16181d"/><path d="M10 40 L20 22 H50 L56 40 Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 40 V46 H56 V40" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><path d="M17 36 L26 32 L32 34.5 L40 27 L47 29" fill="none" stroke="#e8b830" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="29" r="3.2" fill="#e8b830"/></svg>
        <span><b>Fairvio</b><small data-t="tagline"></small></span>
      </a>
      <div class="sel">
        <div class="seg" id="langSeg" role="group" aria-label="Language"></div>
        <div class="seg" id="curSeg" role="group" aria-label="Currency"></div>
        <div class="seg" id="themeSeg" role="group" aria-label="Theme"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="head">
      <h1 data-t="homeTitle"></h1>
      <p data-t="homeLead"></p>
    </div>
    <div class="statusrow">
      <span class="pill" id="livePill"><span class="dot"></span><span id="liveText">…</span></span>
      <span class="pill" id="mktPill"><span class="dot"></span><span id="mktText">…</span></span>
      <span class="xs muted" id="srcText"></span>
    </div>
    <div class="grid g4">
      <div class="card stat hero">
        <div class="herohead"><span class="k" id="heroK"></span><div class="seg" id="heroSeg" role="group" aria-label="Unit"></div></div>
        <span class="v" id="heroV">—</span>
        <span class="s" id="heroS"></span>
        <span class="s" id="heroCh"></span>
      </div>
      <button class="card stat tile" id="tileA" type="button"></button>
      <button class="card stat tile" id="tileB" type="button"></button>
    </div>
    <div class="card">
      <div class="charthead">
        <div><h3 id="chartTitle"></h3><div class="chartnow"><span class="num" id="cNow">—</span><span id="cChg" class="small"></span></div></div>
        <div class="ctrls"><div class="seg" id="unitSeg" role="group" aria-label="Unit"></div><div class="seg" id="rangeSeg" role="group" aria-label="Range"></div></div>
      </div>
      <div class="chartbox" id="chartBox"><canvas id="chart"></canvas><canvas id="chartFx"></canvas><div class="chartmsg" id="chartMsg"></div><div class="tip" id="tip" hidden></div></div>
      <p class="xs muted" style="margin-top:6px" data-t="chartHint"></p>
      <div class="perf" id="perf"></div>
      <p class="xs muted" style="margin-top:10px" id="chartFoot"></p>
    </div>
    <div class="grid g2">
      <div class="card result"><h3 data-t="karTitle"></h3><p class="small muted" data-t="karLead"></p><div class="tbl"><table id="karTbl"></table></div></div>
      <div class="card result"><h3 data-t="coinTitle"></h3><p class="small muted" data-t="coinLead"></p><div class="tbl"><table id="homeCoins"></table></div></div>
    </div>
    <div class="grid g4">
      <div class="card stat"><span class="k" data-t="silver"></span><span class="v" id="pAg">—</span><span class="s" id="pAgS"></span></div>
      <div class="card stat"><span class="k" data-t="platinum"></span><span class="v" id="pPt">—</span><span class="s" id="pPtS"></span></div>
      <div class="card stat"><span class="k" data-t="palladium"></span><span class="v" id="pPd">—</span><span class="s" id="pPdS"></span></div>
      <div class="card stat"><span class="k" id="fxK"></span><span class="v" id="pFx">—</span><span class="s" data-t="fxNote"></span></div>
    </div>
    <h2 data-t="toolsTitle"></h2>
    <div class="links" id="toolLinks"></div>
    <h2 data-t="faqTitle"></h2>
    <div class="card faq" id="faq"></div>
  </section>

  <!-- VALUE -->
  <section class="view" id="v-value" hidden>
    <div class="head"><h1 data-t="valTitle"></h1><p data-t="valLead"></p></div>
    <div class="card">
      <div id="vRows" style="display:flex;flex-direction:column;gap:12px"></div>
      <div style="margin-top:12px"><button class="btn" id="vAdd" data-t="valAdd"></button></div>
      <div class="total">
        <span><b data-t="valTotal"></b><br><span class="small muted" data-t="valTotalNote"></span></span>
        <span class="big" id="vTotal">—</span>
      </div>
      <div class="total" style="border-top:0;padding-top:4px">
        <span class="small" data-t="valFair"></span>
        <span class="num" id="vFair">—</span>
      </div>
    </div>
    <div class="grid g2">
      <div class="card result">
        <h3 data-t="chkTitle"></h3>
        <p class="small muted" data-t="chkLead"></p>
        <div class="seg" id="chkMode" role="group" style="align-self:flex-start"></div>
        <div class="fields">
          <label style="grid-column:1/-1"><span data-t="valItem"></span><select id="chkItem"></select></label>
          <label><span id="chkQtyL"></span><input class="num" id="chkQty" inputmode="decimal" value="1"></label>
          <label><span id="chkPriceL"></span><input class="num" id="chkPrice" inputmode="decimal" placeholder=""></label>
        </div>
        <div class="gauge" aria-hidden="true"><i id="chkMark" style="left:0"></i></div>
        <div class="gscale"><span>0%</span><span>5%</span><span>10%</span><span>15%</span><span>20%</span><span>25%+</span></div>
        <p class="verdict" id="chkOut" style="font-size:17px"></p>
        <p class="small muted" id="chkNote"></p>
      </div>
      <div class="card result">
        <h3 data-t="tblTitle"></h3>
        <p class="small muted" data-t="tblLead"></p>
        <div class="tbl"><table id="coinTbl"></table></div>
      </div>
    </div>
    <p class="note" data-t="valTip"></p>
  </section>

  <!-- COST -->
  <section class="view" id="v-cost" hidden>
    <div class="head"><h1 data-t="costTitle"></h1><p data-t="costLead"></p></div>
    <div class="card">
      <div class="fields">
        <label><span data-t="costMode"></span>
          <select id="cMode"><option value="m" data-t="costMonthly"></option><option value="o" data-t="costOnce"></option></select></label>
        <label><span id="cAmtL"></span><input class="num" id="cAmt" inputmode="decimal" value="100"></label>
        <label><span data-t="costYears"></span><input class="num" id="cYears" inputmode="numeric" value="10"></label>
      </div>
    </div>
    <div class="card">
      <div class="charthead"><h3 id="cHead"></h3><span class="small muted" id="cInvested"></span></div>
      <div class="bars" id="cBars"></div>
      <p class="xs muted" style="margin-top:14px" data-t="costAssume"></p>
    </div>
    <div class="card assume">
      <details>
        <summary data-t="costEdit"></summary>
        <div class="tbl"><table id="cTable"></table></div>
        <p class="xs muted" style="margin-top:10px" data-t="costSrc"></p>
        <div style="margin-top:10px"><button class="btn" id="cReset" data-t="costReset"></button></div>
      </details>
    </div>
    <p class="note" data-t="costNote"></p>
  </section>

  <!-- TAX -->
  <section class="view" id="v-tax" hidden>
    <div class="head"><h1 data-t="taxTitle"></h1><p data-t="taxLead"></p></div>
    <div class="seg" id="taxSeg" role="group" aria-label="Country" style="align-self:flex-start"></div>
    <div id="taxCalc" class="grid g2">
      <div class="card"><div class="fields" id="txFields"></div></div>
      <div class="card result">
        <span class="small muted" data-t="tResult"></span>
        <span class="verdict" id="tVerdict">—</span>

faq1q:{nl:"Waarom is de prijs in de winkel anders dan deze goudprijs?",en:"Why is the shop price different from this gold price?",de:"Warum ist der Preis beim Händler anders als dieser Goldpreis?",tr:"Dükkândaki fiyat neden bu altın fiyatından farklı?"},
faq1a:{nl:"Dit is de wereldprijs van puur goud. Een winkel rekent bij verkoop een opslag voor maken, verzenden en winst, en biedt bij inkoop iets minder. Hoe kleiner het stuk, hoe groter de opslag.",en:"This is the world price of pure gold. A shop adds a premium for production, shipping and profit when selling, and pays a bit less when buying. The smaller the piece, the bigger the premium.",de:"Das ist der Weltmarktpreis für reines Gold. Ein Händler schlägt beim Verkauf etwas für Herstellung, Versand und Gewinn auf und zahlt beim Ankauf etwas weniger. Je kleiner das Stück, desto höher das Aufgeld.",tr:"Bu saf altının dünya fiyatıdır. Dükkân satarken üretim, kargo ve kâr için prim ekler, alırken biraz daha az öder. Parça küçüldükçe prim artar."},
faq2q:{nl:"Wat betekent 585, 750 of 916 in mijn sieraad?",en:"What does 585, 750 or 916 on my jewellery mean?",de:"Was bedeutet 585, 750 oder 916 in meinem Schmuck?",tr:"Takımdaki 585, 750 veya 916 ne anlama geliyor?"},
faq2a:{nl:"Dat is het keurmerk: hoeveel duizendste deel puur goud is. 585 is 14 karaat (58,5%), 750 is 18 karaat (75%), 916 is 22 karaat (91,6%) en 999 is 24 karaat.",en:"That is the hallmark: how many thousandths are pure gold. 585 is 14 carat (58.5%), 750 is 18 carat (75%), 916 is 22 carat (91.6%) and 999 is 24 carat.",de:"Das ist der Feingehalt: wie viele Tausendstel reines Gold sind. 585 ist 14 Karat (58,5 %), 750 ist 18 Karat (75 %), 916 ist 22 Karat (91,6 %) und 999 ist 24 Karat.",tr:"Bu ayar damgasıdır: binde kaçının saf altın olduğunu gösterir. 585 = 14 ayar (%58,5), 750 = 18 ayar (%75), 916 = 22 ayar (%91,6), 999 = 24 ayar."},

faq4q:{nl:"Waarom gaat de goudprijs op en neer?",en:"Why does the gold price go up and down?",de:"Warum steigt und fällt der Goldpreis?",tr:"Altın fiyatı neden iner çıkar?"},
faq4a:{nl:"Vooral door de rente, de koers van de dollar, onzekerheid in de wereld en aankopen door centrale banken. Omdat goud in dollars wordt verhandeld, verandert de prijs in euro's ook met de wisselkoers.",en:"Mainly because of interest rates, the dollar, global uncertainty and central bank buying. Because gold trades in dollars, the price in other currencies also moves with the exchange rate.",de:"Vor allem durch Zinsen, den Dollarkurs, weltweite Unsicherheit und Käufe der Zentralbanken. Da Gold in Dollar gehandelt wird, bewegt sich der Euro-Preis auch mit dem Wechselkurs.",tr:"Özellikle faiz, dolar kuru, dünyadaki belirsizlik ve merkez bankası alımları nedeniyle. Altın dolarla işlem gördüğü için euro ve lira fiyatı kurla da değişir."},
faq5q:{nl:"Hoe actueel zijn de prijzen?",en:"How current are the prices?",de:"Wie aktuell sind die Preise?",tr:"Fiyatlar ne kadar güncel?"},
faq5a:{nl:"De goudprijs wordt elke 15 seconden opgehaald, zilver, platina en palladium elke minuut, en de wisselkoersen elke 10 minuten. In het weekend is de goudmarkt dicht en blijft de prijs staan.",en:"The gold price is fetched every 15 seconds, silver, platinum and palladium every minute, and exchange rates every 10 minutes. At weekends the gold market is closed and the price stays put.",de:"Der Goldpreis wird alle 15 Sekunden abgerufen, Silber, Platin und Palladium jede Minute, die Wechselkurse alle 10 Minuten. Am Wochenende ist der Goldmarkt geschlossen und der Preis bleibt stehen.",tr:"Altın fiyatı 15 saniyede bir, gümüş, platin ve paladyum dakikada bir, döviz kurları 10 dakikada bir alınır. Hafta sonu altın piyasası kapalıdır ve fiyat sabit kalır."},

chkNoteBuyJ:{nl:"Bij sieraden zit er arbeidsloon in de prijs. Dan is 10 tot 25% boven de goudwaarde niet vreemd. Bij munten en baren is 2 tot 6% gebruikelijk.",en:"Jewellery prices include labour. Then 10 to 25% above the gold value is not unusual. For coins and bars, 2 to 6% is common.",de:"Bei Schmuck ist Arbeitslohn im Preis enthalten. Dann sind 10 bis 25 % über dem Goldwert nicht ungewöhnlich. Bei Münzen und Barren sind 2 bis 6 % üblich.",tr:"Takıda fiyatın içinde işçilik vardır. Bu yüzden altın değerinin %10 ile %25 üzerinde olması tuhaf değildir. Sikke ve külçede %2 ile %6 olağandır."},
chkNoteBuyC:{nl:"Voor munten en baren is 2 tot 6% boven de goudwaarde gebruikelijk. Kleine stukken zijn relatief duurder.",en:"For coins and bars, 2 to 6% above the gold value is common. Small pieces are relatively more expensive.",de:"Bei Münzen und Barren sind 2 bis 6 % über dem Goldwert üblich. Kleine Stücke sind verhältnismäßig teurer.",tr:"Sikke ve külçede altın değerinin %2 ile %6 üzeri olağandır. Küçük parçalar görece daha pahalıdır."},
chkNoteSell:{nl:"Bij verkoop houdt de winkel meestal een paar procent in. Het arbeidsloon van sieraden krijg je bij verkoop meestal niet terug.",en:"When selling, the shop usually keeps a few percent. You usually don't get the labour cost of jewellery back.",de:"Beim Verkauf behält der Händler meist ein paar Prozent ein. Den Arbeitslohn von Schmuck bekommst du meist nicht zurück.",tr:"Satışta dükkân genelde yüzde birkaç keser. Takının işçilik bedelini satışta genelde geri alamazsın."},

valTip:{nl:"Tip: vraag bij verkoop altijd naar de prijs per gram en het gewicht op een bon. Consumentenprogramma's vonden opkopers die maar een fractie van de waarde boden. Vergelijk minstens twee biedingen.",en:"Tip: when selling, always ask for the price per gram and the weight on a receipt. Consumer programmes found buyers offering only a fraction of the value. Compare at least two offers.",de:"Tipp: Frag beim Verkauf immer nach dem Grammpreis und lass dir das Gewicht quittieren. Verbrauchertests fanden Ankäufer, die nur einen Bruchteil des Werts boten. Vergleiche mindestens zwei Angebote.",tr:"İpucu: Satarken her zaman gram fiyatını ve ağırlığı fişe yazdır. Tüketici programları değerin çok altında teklif veren alıcılar buldu. En az iki teklifi karşılaştır."},

tExplFree:{nl:"Je hield het goud langer dan één jaar. Dan is de winst in Duitsland belastingvrij (§ 23 EStG).",en:"You held the gold for more than one year. In Germany the gain is then tax-free (§ 23 EStG).",de:"Du hast das Gold länger als ein Jahr gehalten. Dann ist der Gewinn steuerfrei (§ 23 EStG).",tr:"Altını bir yıldan uzun tuttun. Almanya'da kazanç bu durumda vergiden muaftır (§ 23 EStG)."},
tExplUnder:{nl:"Binnen een jaar verkocht, maar je totale winst uit privéverkopen dit jaar blijft onder € 1.000. Dan betaal je niets (vrijgrens).",en:"Sold within a year, but your total private-sale gains this year stay below €1,000. Then you pay nothing (exemption limit).",de:"Innerhalb eines Jahres verkauft, aber deine gesamten privaten Veräußerungsgewinne bleiben dieses Jahr unter 1.000 €. Dann zahlst du nichts (Freigrenze).",tr:"Bir yıl içinde sattın, ama bu yılki toplam özel satış kazancın 1.000 €'nun altında. Bu durumda vergi yok (muafiyet sınırı)."},
tExplTax:{nl:"Binnen een jaar verkocht en je totale winst uit privéverkopen is € 1.000 of meer. Dan is de hele winst belast tegen je persoonlijke tarief (zonder kerkbelasting). Wacht je tot de datum hieronder, dan is het belastingvrij.",en:"Sold within a year and your total private-sale gains are €1,000 or more. Then the whole gain is taxed at your personal rate (excluding church tax). If you wait until the date below, it is tax-free.",de:"Innerhalb eines Jahres verkauft und deine privaten Veräußerungsgewinne liegen bei 1.000 € oder mehr. Dann ist der ganze Gewinn mit deinem persönlichen Steuersatz zu versteuern (ohne Kirchensteuer). Wartest du bis zum Datum unten, ist er steuerfrei.",tr:"Bir yıl içinde sattın ve toplam özel satış kazancın 1.000 € veya fazla. Bu durumda kazancın tamamı kişisel oranından vergilendirilir (kilise vergisi hariç). Aşağıdaki tarihe kadar beklersen vergisiz olur."},
tExplEtf:{nl:"Een goud-ETF zonder leveringsrecht is in Duitsland altijd belast met afgeltingsheffing: 25% plus 5,5% solidariteitstoeslag (zonder kerkbelasting), na de Sparer-Pauschbetrag van € 1.000. Hoe lang je het hield maakt niet uit.",en:"A gold ETF without a delivery right is always taxed in Germany with flat-rate withholding tax: 25% plus 5.5% solidarity surcharge (without church tax), after the €1,000 saver's allowance. The holding period does not matter.",de:"Ein Gold-ETF ohne Lieferanspruch unterliegt immer der Abgeltungsteuer: 25 % plus 5,5 % Solidaritätszuschlag (ohne Kirchensteuer), nach dem Sparer-Pauschbetrag von 1.000 €. Die Haltedauer spielt keine Rolle.",tr:"Teslim hakkı olmayan bir altın ETF'i Almanya'da her zaman stopaj vergisine tabidir: %25 artı %5,5 dayanışma vergisi (kilise vergisi hariç), 1.000 € tasarruf muafiyetinden sonra. Elde tutma süresi önemli değildir."},
tExplLoss:{nl:"Je verkocht met verlies. Dan betaal je geen belasting.",en:"You sold at a loss. Then you pay no tax.",de:"Du hast mit Verlust verkauft. Dann zahlst du keine Steuer.",tr:"Zararına sattın. Bu durumda vergi ödemezsin."},
tExplDates:{nl:"Vul geldige data in (verkoop na aankoop).",en:"Enter valid dates (sale after purchase).",de:"Gib gültige Daten ein (Verkauf nach Kauf).",tr:"Geçerli tarihler gir (satış alıştan sonra)."},
nlTitle:{nl:"Nederland: geen belasting bij verkoop",en:"Netherlands: no tax when selling",de:"Niederlande: keine Steuer beim Verkauf",tr:"Hollanda: satışta vergi yok"},
nlBody:{nl:"In Nederland betaal je geen belasting over de winst als je goud verkoopt. Goud telt wel mee in box 3: de waarde op 1 januari hoort bij je vermogen, en daarover kan vermogensbelasting gelden boven het heffingsvrije vermogen. Beleggingsgoud (baren en munten van minstens 99,5% en 90% zuiver) is vrij van btw.",en:"In the Netherlands you pay no tax on the gain when you sell gold. Gold does count in box 3: its value on 1 January is part of your wealth, which may be taxed above the tax-free allowance. Investment gold (bars and coins of at least 99.5% and 90% purity) is exempt from VAT.",de:"In den Niederlanden zahlst du beim Verkauf von Gold keine Steuer auf den Gewinn. Gold zählt aber in „Box 3“: Sein Wert am 1. Januar gehört zu deinem Vermögen, auf das oberhalb des Freibetrags Vermögensteuer anfallen kann. Anlagegold (Barren ab 99,5 % und Münzen ab 90 % Feinheit) ist mehrwertsteuerfrei.",tr:"Hollanda'da altın satınca kazanç üzerinden vergi ödemezsin. Ancak altın 3. kutuda (box 3) sayılır: 1 Ocak'taki değeri servetinin parçasıdır ve vergisiz sınırın üzerinde servet vergisi çıkabilir. Yatırım altını (en az %99,5 saflıkta külçe ve %90 saflıkta sikke) KDV'den muaftır."},
ukTitle:{nl:"Verenigd Koninkrijk: let op welke munt",en:"United Kingdom: it depends on the coin",de:"Vereinigtes Königreich: es kommt auf die Münze an",tr:"Birleşik Krallık: sikkeye bağlı"},
ukBody:{nl:"Britse munten die wettig betaalmiddel zijn, zoals de Sovereign en de Britannia, zijn vrijgesteld van vermogenswinstbelasting (CGT). Voor baren en buitenlandse munten geldt CGT over winst boven de jaarlijkse vrijstelling van £ 3.000. Beleggingsgoud is vrij van btw.",en:"British coins that are legal tender, such as the Sovereign and the Britannia, are exempt from Capital Gains Tax (CGT). For bars and foreign coins, CGT applies to gains above the annual exempt amount of £3,000. Investment gold is exempt from VAT.",de:"Britische Münzen mit gesetzlichem Zahlungsmittelstatus, etwa Sovereign und Britannia, sind von der Kapitalertragsteuer (CGT) befreit. Für Barren und ausländische Münzen gilt CGT auf Gewinne über dem jährlichen Freibetrag von 3.000 £. Anlagegold ist mehrwertsteuerfrei.",tr:"Sovereign ve Britannia gibi yasal ödeme aracı olan İngiliz sikkeleri sermaye kazancı vergisinden (CGT) muaftır. Külçe ve yabancı sikkelerde yıllık 3.000 £ muafiyetin üzerindeki kazanca CGT uygulanır. Yatırım altını KDV'den muaftır."},

atExplUnder:{nl:"Binnen een jaar verkocht, maar je totale winst uit zulke verkopen blijft dit jaar onder € 440. Dan betaal je niets (vrijgrens).",en:"Sold within a year, but your total gains from such sales stay below €440 this year. Then you pay nothing (exemption limit).",de:"Innerhalb eines Jahres verkauft, aber deine Gewinne aus solchen Verkäufen bleiben dieses Jahr unter 440 €. Dann zahlst du nichts (Freigrenze).",tr:"Bir yıl içinde sattın, ama bu yılki toplam kazancın 440 €'nun altında. Bu durumda vergi yok (muafiyet sınırı)."},
atExplTax:{nl:"Binnen een jaar verkocht en je winst is € 440 of meer. Dan is de hele winst belast tegen je persoonlijke tarief. Wacht je tot de datum hieronder, dan is het belastingvrij.",en:"Sold within a year and your gain is €440 or more. Then the whole gain is taxed at your personal rate. If you wait until the date below, it is tax-free.",de:"Innerhalb eines Jahres verkauft und dein Gewinn liegt bei 440 € oder mehr. Dann ist der ganze Gewinn mit deinem persönlichen Steuersatz zu versteuern. Wartest du bis zum Datum unten, ist er steuerfrei.",tr:"Bir yıl içinde sattın ve kazancın 440 € veya fazla. Bu durumda kazancın tamamı kişisel oranından vergilendirilir. Aşağıdaki tarihe kadar beklersen vergisiz olur."},
atExplEtf:{nl:"Een goud-ETC of -ETF is in Oostenrijk altijd belast met 27,5% kapitaalopbrengstbelasting (KESt), hoe lang je hem ook hield.",en:"A gold ETC or ETF is always taxed in Austria at 27.5% capital gains tax (KESt), however long you held it.",de:"Ein Gold-ETC oder -ETF unterliegt in Österreich immer der Kapitalertragsteuer (KESt) von 27,5 %, egal wie lange du ihn gehalten hast.",tr:"Altın ETC veya ETF'i Avusturya'da ne kadar tutarsan tut her zaman %27,5 sermaye kazancı vergisine (KESt) tabidir."},

nlExpl:{nl:"In Nederland betaal je geen belasting bij verkoop van goud. Wel telt goud in box 3: de Belastingdienst rekent in 2026 met een vast rendement van 6,00% op bezittingen zoals goud, 1,28% op spaargeld en 2,70% op schulden, en heft daarover 36% boven € 59.357 per persoon. Was je echte rendement lager (bijvoorbeeld omdat goud daalde), dan kun je dat laten zien met de tegenbewijsregeling. De percentages voor spaargeld en schulden zijn nog voorlopig.",en:"In the Netherlands you pay no tax when selling gold. Gold does count in box 3: for 2026 the tax office assumes a fixed return of 6.00% on assets such as gold, 1.28% on savings and 2.70% on debts, and taxes that at 36% above €59,357 per person. If your real return was lower (for example because gold fell), you can show that under the rebuttal scheme. The savings and debt rates are still provisional.",de:"In den Niederlanden zahlst du beim Verkauf von Gold keine Steuer. Gold zählt aber in „Box 3“: Für 2026 nimmt das Finanzamt eine feste Rendite von 6,00 % auf Vermögen wie Gold, 1,28 % auf Ersparnisse und 2,70 % auf Schulden an und besteuert das mit 36 % oberhalb von 59.357 € pro Person. War deine echte Rendite niedriger (z. B. weil Gold gefallen ist), kannst du das per Gegenbeweis nachweisen. Die Sätze für Ersparnisse und Schulden sind noch vorläufig.",tr:"Hollanda'da altın satınca vergi ödemezsin. Ama altın 3. kutuda (box 3) sayılır: 2026 için vergi dairesi altın gibi varlıklarda %6,00, birikimde %1,28 ve borçlarda %2,70 sabit getiri varsayar ve kişi başı 59.357 €'nun üzerini %36 vergilendirir. Gerçek getirin daha düşükse (örneğin altın düştüyse) bunu karşı kanıt düzenlemesiyle gösterebilirsin. Birikim ve borç oranları henüz geçicidir."},

beExplTax:{nl:"Sinds 2026 betaal je in België 10% belasting op de winst bij verkoop van beleggingsgoud, boven een vrijstelling van € 10.000 per jaar. Kocht je vóór 2026, dan telt de waarde op 31 december 2025 als aankoopprijs. Je moet de winst zelf aangeven.",en:"Since 2026 Belgium taxes the gain on selling investment gold at 10%, above an exemption of €10,000 per year. If you bought before 2026, the value on 31 December 2025 counts as purchase price. You must declare the gain yourself.",de:"Seit 2026 besteuert Belgien den Gewinn aus dem Verkauf von Anlagegold mit 10 %, oberhalb eines Freibetrags von 10.000 € pro Jahr. Bei Kauf vor 2026 gilt der Wert am 31. Dezember 2025 als Kaufpreis. Den Gewinn musst du selbst angeben.",tr:"Belçika 2026'dan beri yatırım altını satışından elde edilen kazancı, yıllık 10.000 € muafiyetin üzerinde %10 vergilendirir. 2026'dan önce aldıysan 31 Aralık 2025 değeri alış fiyatı sayılır. Kazancı kendin beyan etmelisin."},
beExplFree:{nl:"Je winst valt binnen de jaarlijkse vrijstelling van € 10.000. Dan betaal je niets, maar je moet de winst wel aangeven.",en:"Your gain falls within the annual €10,000 exemption. You pay nothing, but you must still declare the gain.",de:"Dein Gewinn liegt innerhalb des jährlichen Freibetrags von 10.000 €. Du zahlst nichts, musst den Gewinn aber angeben.",tr:"Kazancın yıllık 10.000 € muafiyetin içinde. Vergi ödemezsin ama kazancı yine de beyan etmelisin."},
beExplJew:{nl:"Sieraden vallen niet onder de nieuwe Belgische meerwaardebelasting. Bij normaal beheer van je privévermogen betaal je bij verkoop dus geen belasting.",en:"Jewellery is not covered by the new Belgian capital gains tax. With normal management of your private wealth, you pay no tax when selling.",de:"Schmuck fällt nicht unter die neue belgische Wertzuwachssteuer. Bei normaler Verwaltung deines Privatvermögens zahlst du beim Verkauf also keine Steuer.",tr:"Takılar Belçika'nın yeni sermaye kazancı vergisine girmez. Özel servetin olağan yönetiminde satışta vergi ödemezsin."},

ukExplLegal:{nl:"Britse munten die wettig betaalmiddel zijn, zoals de Sovereign en de Britannia, zijn vrijgesteld van vermogenswinstbelasting (CGT).",en:"British coins that are legal tender, such as the Sovereign and the Britannia, are exempt from Capital Gains Tax (CGT).",de:"Britische Münzen mit gesetzlichem Zahlungsmittelstatus, wie Sovereign und Britannia, sind von der Kapitalertragsteuer (CGT) befreit.",tr:"Sovereign ve Britannia gibi yasal ödeme aracı olan İngiliz sikkeleri sermaye kazancı vergisinden (CGT) muaftır."},
ukExplBar:{nl:"Op baren en buitenlandse munten betaal je CGT over winst boven de jaarvrijstelling van £ 3.000: 18% in het basistarief, 24% daarboven.",en:"On bars and foreign coins you pay CGT on gains above the £3,000 annual exempt amount: 18% at the basic rate, 24% above it.",de:"Auf Barren und ausländische Münzen zahlst du CGT auf Gewinne über dem Jahresfreibetrag von 3.000 £: 18 % im Basissatz, 24 % darüber.",tr:"Külçe ve yabancı sikkelerde 3.000 £ yıllık muafiyetin üzerindeki kazanca CGT ödersin: temel oranda %18, üzerinde %24."},
ukExplChattel:{nl:"Sieraden zijn 'roerende zaken'. Bij een verkoopprijs tot £ 6.000 is de winst vrijgesteld.",en:"Jewellery counts as a chattel. If the sale price is £6,000 or less, the gain is exempt.",de:"Schmuck gilt als bewegliche Sache (chattel). Bei einem Verkaufspreis bis 6.000 £ ist der Gewinn befreit.",tr:"Takılar taşınır mal (chattel) sayılır. Satış fiyatı 6.000 £ veya altındaysa kazanç muaftır."},
ukExplJew:{nl:"Sieraden boven £ 6.000: de belastbare winst is maximaal 5/3 van het deel boven £ 6.000. Daarover betaal je CGT boven de jaarvrijstelling.",en:"Jewellery above £6,000: the taxable gain is at most 5/3 of the amount above £6,000. CGT applies above the annual exempt amount.",de:"Schmuck über 6.000 £: Der steuerpflichtige Gewinn beträgt höchstens 5/3 des Betrags über 6.000 £. Darauf fällt CGT über dem Jahresfreibetrag an.",tr:"6.000 £ üzerindeki takılarda vergilendirilebilir kazanç en fazla 6.000 £'u aşan kısmın 5/3'üdür. Yıllık muafiyetin üzerine CGT uygulanır."},
chTitle:{nl:"Zwitserland: geen belasting bij verkoop",en:"Switzerland: no tax when selling",de:"Schweiz: keine Steuer beim Verkauf",tr:"İsviçre: satışta vergi yok"},
chBody:{nl:"Voor particulieren is winst op privévermogen in Zwitserland belastingvrij, dus ook winst op goud. Goud telt wel mee voor de kantonale vermogensbelasting, gewaardeerd volgens de koerslijst van de federale belastingdienst (ESTV).",en:"For private individuals in Switzerland, gains on private assets are tax-free, including gold. Gold does count towards cantonal wealth tax, valued using the federal tax administration's price list (ESTV).",de:"Für Privatpersonen sind Gewinne auf Privatvermögen in der Schweiz steuerfrei, auch auf Gold. Gold zählt aber zur kantonalen Vermögenssteuer und wird nach der Kursliste der ESTV bewertet.",tr:"İsviçre'de bireyler için özel servet kazançları, altın dahil, vergiden muaftır. Ancak altın kantonal servet vergisine dahildir ve federal vergi idaresinin (ESTV) kur listesine göre değerlenir."},
trTitle:{nl:"Turkije: geen belasting bij verkoop van fysiek goud",en:"Turkey: no tax on selling physical gold",de:"Türkei: keine Steuer beim Verkauf von physischem Gold",tr:"Türkiye: fiziki altın satışında vergi yok"},
trBody:{nl:"Wie in Turkije woont, betaalt bij af en toe verkopen van fysiek goud geen inkomstenbelasting. Bij aankoop via een goudrekening bij de bank geldt 0,2% BSMV. Goudfondsen gekocht vanaf 9 juli 2025 hebben 17,5% bronheffing. Woon je buiten Turkije, bijvoorbeeld in Duitsland of Nederland? Dan gelden de regels van je woonland: kies dat land hierboven.",en:"If you live in Turkey, occasional sales of physical gold are not subject to income tax. Buying via a bank gold account carries 0.2% BSMV. Gold funds bought from 9 July 2025 carry 17.5% withholding tax. Living outside Turkey, for example in Germany or the Netherlands? Then the rules of your country of residence apply: choose that country above.",de:"Wer in der Türkei lebt, zahlt beim gelegentlichen Verkauf von physischem Gold keine Einkommensteuer. Beim Kauf über ein Goldkonto der Bank fallen 0,2 % BSMV an. Goldfonds, die ab dem 9. Juli 2025 gekauft wurden, unterliegen 17,5 % Quellensteuer. Du wohnst außerhalb der Türkei, z. B. in Deutschland oder den Niederlanden? Dann gelten die Regeln deines Wohnlandes: wähle dieses Land oben.",tr:"Türkiye'de yaşayanlar ara sıra yaptıkları fiziki altın satışlarında gelir vergisi ödemez. Bankada altın hesabıyla alımda %0,2 BSMV uygulanır. 9 Temmuz 2025'ten itibaren alınan altın fonlarında %17,5 stopaj vardır. Türkiye dışında, örneğin Almanya veya Hollanda'da mı yaşıyorsun? O zaman ikamet ettiğin ülkenin kuralları geçerlidir: yukarıdan o ülkeyi seç."},
taxNote:{nl:"Dit is een indicatie en geen belastingadvies. Regels kunnen veranderen; check je eigen situatie bij een adviseur of de belastingdienst.",en:"This is an indication, not tax advice. Rules can change; check your own situation with an adviser or the tax office.",de:"Das ist ein Richtwert und keine Steuerberatung. Regeln können sich ändern; prüfe deine Situation mit einem Steuerberater oder dem Finanzamt.",tr:"Bu bir tahmindir, vergi tavsiyesi değildir. Kurallar değişebilir; kendi durumunu bir danışmana veya vergi dairesine danış."},

buyTitle:{nl:"Wat hoort goud te kosten?",en:"What should gold cost?",de:"Was sollte Gold kosten?",tr:"Altın ne kadar olmalı?"},
buyLead:{nl:"Een winkel rekent altijd een opslag bovenop de goudwaarde. Hoe kleiner het stuk, hoe hoger de opslag. Zo zie je of een prijs redelijk is.",en:"A shop always charges a premium on top of the gold value. The smaller the piece, the higher the premium. This shows whether a price is reasonable.",de:"Ein Händler verlangt immer ein Aufgeld auf den Goldwert. Je kleiner das Stück, desto höher das Aufgeld. So siehst du, ob ein Preis fair ist.",tr:"Satıcı her zaman altın değerinin üzerine bir prim ekler. Parça ne kadar küçükse prim o kadar yüksek olur. Böylece bir fiyatın makul olup olmadığını görürsün."},
buyPhase:{nl:"Prototype: hier komen straks de echte, actuele prijzen van handelaren naast elkaar. Nu zie je de live goudwaarde en een gangbare prijsband.",en:"Prototype: this is where dealers' real, current prices will appear side by side. For now you see the live gold value and a typical price band.",de:"Prototyp: Hier erscheinen später die echten, aktuellen Händlerpreise nebeneinander. Jetzt siehst du den Live-Goldwert und eine übliche Preisspanne.",tr:"Prototip: Burada yakında satıcıların gerçek, güncel fiyatları yan yana olacak. Şimdilik canlı altın değerini ve olağan bir fiyat aralığını görüyorsun."},

aboutTitle:{nl:"Over Fairvio",en:"About Fairvio",de:"Über Fairvio",tr:"Fairvio hakkında"},
aboutWho:{nl:"Wie zit erachter?",en:"Who is behind it?",de:"Wer steckt dahinter?",tr:"Arkasında kim var?"},
aboutWhoBody:{nl:"Fairvio is gemaakt door Furkan Kilic uit Nederland. Het doel: eerlijke, begrijpelijke informatie over goud en geld, in je eigen taal. Fairvio is in opbouw; dit is een eerste versie.",en:"Fairvio is made by Furkan Kilic from the Netherlands. The goal: honest, clear information about gold and money, in your own language. Fairvio is under construction; this is an early version.",de:"Fairvio wird von Furkan Kilic aus den Niederlanden gemacht. Das Ziel: ehrliche, verständliche Informationen über Gold und Geld, in deiner Sprache. Fairvio befindet sich im Aufbau; dies ist eine frühe Version.",tr:"Fairvio, Hollanda'dan Furkan Kilic tarafından yapıldı. Amaç: altın ve para hakkında dürüst, anlaşılır bilgi, kendi dilinde. Fairvio yapım aşamasında; bu ilk sürümdür."},
aboutAuthor:{nl:"Over de maker: Furkan Kilic",en:"About the maker: Furkan Kilic",de:"Über den Macher: Furkan Kilic",tr:"Kurucu hakkında: Furkan Kilic"},
aboutAuthorBody1:{nl:"Ik ben Furkan Kilic en ik heb Fairvio opgezet omdat goud voor veel mensen een vraagteken is, terwijl het om echt geld gaat. Wat is mijn ketting waard? Krijg ik een eerlijk bod? Betaal ik belasting als ik verkoop? Wie die vragen opzoekt, belandt vaak bij een partij die er zelf aan verdient.",en:"I'm Furkan Kilic and I started Fairvio because gold is a question mark for many people, even though real money is at stake. What is my necklace worth? Am I getting a fair offer? Do I pay tax when I sell? Anyone searching for answers often ends up with a party that profits from the answer.",de:"Ich bin Furkan Kilic und habe Fairvio gegründet, weil Gold für viele Menschen ein Fragezeichen ist, obwohl es um echtes Geld geht. Was ist meine Kette wert? Bekomme ich ein faires Angebot? Zahle ich beim Verkauf Steuern? Wer danach sucht, landet oft bei jemandem, der selbst daran verdient.",tr:"Ben Furkan Kilic. Fairvio'yu kurdum, çünkü altın gerçek para olmasına rağmen birçok insan için bir soru işareti. Kolyem ne eder? Adil bir teklif mi alıyorum? Satarken vergi öder miyim? Bu soruları araştıran çoğu kişi, cevaptan kendisi kazanan birine ulaşıyor."},
aboutAuthorBody2:{nl:"Ik wil dat iedereen, in zijn eigen taal, met dezelfde informatie aan tafel zit als de winkel. Daarom laat Fairvio zien hoe we rekenen, welke bronnen we gebruiken en wat we niet weten. Geen mooie praatjes, geen angst, wel heldere cijfers.",en:"I want everyone, in their own language, to have the same information as the shop. That's why Fairvio shows how we calculate, which sources we use and what we don't know. No sales talk, no fear, just clear numbers.",de:"Ich möchte, dass jeder, in seiner eigenen Sprache, mit denselben Informationen verhandelt wie der Händler. Darum zeigt Fairvio, wie wir rechnen, welche Quellen wir nutzen und was wir nicht wissen. Keine schönen Worte, keine Angst, sondern klare Zahlen.",tr:"Herkesin, kendi dilinde, dükkânla aynı bilgiye sahip olmasını istiyorum. Bu yüzden Fairvio nasıl hesapladığımızı, hangi kaynakları kullandığımızı ve neyi bilmediğimizi gösterir. Satış lafları yok, korku yok, sadece net rakamlar."},
aboutAuthorBody3:{nl:"Fairvio groeit stap voor stap. Mis je iets, of klopt er iets niet? Laat het me weten, dan verbeter ik het.",en:"Fairvio grows step by step. Missing something, or is something wrong? Let me know and I'll improve it.",de:"Fairvio wächst Schritt für Schritt. Fehlt dir etwas oder stimmt etwas nicht? Sag es mir, dann verbessere ich es.",tr:"Fairvio adım adım büyüyor. Eksik ya da yanlış bir şey mi var? Bana yaz, düzelteyim."},

aboutMoneyBody:{nl:"Nu nog niet. Later kan een aanbieder ons een vergoeding geven als je via een link klant wordt. Dat verandert nooit de uitkomst van een calculator of de volgorde van een lijst. Elke betaalde link wordt duidelijk gemarkeerd.",en:"Not yet. Later a provider may pay us a fee if you become a customer via a link. That never changes a calculator's result or the order of a list. Every paid link will be clearly marked.",de:"Noch gar nicht. Später kann ein Anbieter uns eine Vergütung zahlen, wenn du über einen Link Kunde wirst. Das ändert nie das Ergebnis eines Rechners oder die Reihenfolge einer Liste. Jeder bezahlte Link wird klar gekennzeichnet.",tr:"Şimdilik kazanmıyoruz. İleride bir bağlantı üzerinden müşteri olursan sağlayıcı bize ücret ödeyebilir. Bu hiçbir zaman hesaplayıcının sonucunu ya da listenin sırasını değiştirmez. Her ücretli bağlantı açıkça belirtilir."},

aboutDataBody:{nl:"Live goud-, zilver- en platinaprijs: gold-api.com, met Binance (PAXG) als reserve. Wisselkoersen: Europese Centrale Bank via Frankfurter. Koershistorie: Binance. Nieuws: openbare RSS-feeds van onder meer NOS, BBC, ECB, Federal Reserve, DW en AA, elke 10 minuten verzameld.",en:"Live gold, silver and platinum price: gold-api.com, with Binance (PAXG) as backup. Exchange rates: European Central Bank via Frankfurter. Price history: Binance. News: public RSS feeds from NOS, BBC, ECB, Federal Reserve, DW, AA and others, collected every 10 minutes.",de:"Live-Preise für Gold, Silber und Platin: gold-api.com, mit Binance (PAXG) als Reserve. Wechselkurse: Europäische Zentralbank über Frankfurter. Kurshistorie: Binance. Nachrichten: öffentliche RSS-Feeds u. a. von NOS, BBC, EZB, Federal Reserve, DW und AA, alle 10 Minuten gesammelt.",tr:"Canlı altın, gümüş ve platin fiyatı: gold-api.com, yedek olarak Binance (PAXG). Döviz kurları: Frankfurter üzerinden Avrupa Merkez Bankası. Fiyat geçmişi: Binance. Haberler: NOS, BBC, ECB, Federal Reserve, DW, AA ve diğerlerinin açık RSS akışları, 10 dakikada bir toplanır."},

{ const q = new URLSearchParams(location.search).get("lang"); if (LANGS.includes(q)) lang = q;

const t = (k, ...a) => { const e = T[k]; let s = e ? (e[lang] ?? e.en) : k; a.forEach((v,i)=> s = s.replace("{"+i+"}", v)); return s; };

const parseNum = s => { s = String(s||"").trim().replace(/\s/g,""); if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  else if (s.includes(",")) s = s.replace(",","."); return parseFloat(s); };

/* ---------------- data ---------------- */
const S = { unit:"kg", oz:null, ag:null, pt:null, src:null, at:null, ok:false, fx:null /* units of cur per USD */, rates:null /* per EUR */, hist:{}, range:"D", news:null, newsErr:false, newsCat:"all" };
async function getJSON(url, ms=9000){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), ms);
  try { const r = await fetch(url, {signal:ctl.signal, cache:"no-store"}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
const BIN = ["https://data-api.binance.vision","https://api.binance.com"];
async function binPrice(sym){ for (const b of BIN){ try { const j = await getJSON(`${b}/api/v3/ticker/price?symbol=${sym}`); if (+j.price>0) return +j.price; } catch(e){} } throw new Error("binance"); }
async function updateFx(){
  const srcs = [
    async()=> (await getJSON("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD,GBP,TRY")).rates,
    async()=> (await getJSON("https://api.frankfurter.app/latest?from=EUR&to=USD,GBP,TRY")).rates,
    async()=> { const r = (await getJSON("https://open.er-api.com/v6/latest/EUR")).rates; return {USD:r.USD, GBP:r.GBP, TRY:r.TRY}; },
    async()=> { const [e,g,tr] = await Promise.all([binPrice("EURUSDT"), binPrice("GBPUSDT"), binPrice("USDTTRY")]); return {USD:e, GBP:e/g, TRY:e*tr}; },
  ];
  for (const f of srcs){ try { const r = await f(); if (r.USD>0.5 && r.USD<2 && r.GBP>0.4 && r.TRY>1){ S.rates = {EUR:1, USD:+r.USD, GBP:+r.GBP, TRY:+r.TRY}; break; } } catch(e){} }
  renderPrices(); renderAllTools();
}
const perUsd = c => S.rates ? S.rates[c] / S.rates.USD : null;   // units of currency c per 1 USD
const ozCur = () => (S.oz!=null && perUsd(cur)) ? S.oz * perUsd(cur) : null;
const gramCur = () => { const o = ozCur(); return o==null ? null : o / OZ; };
async function updateMetals(){
  let p = null, src = null;
  try { const j = await getJSON("https://api.gold-api.com/price/XAU"); if (+j.price>500 && +j.price<50000){ p = +j.price; src = "gold-api.com"; } } catch(e){}
  if (p==null){ try { const v = await binPrice("PAXGUSDT"); if (v>500 && v<50000){ p = v; src = "Binance PAXG"; } } catch(e){} }
  if (p!=null){ S.oz = p; S.src = src; S.at = new Date(); S.ok = true; } else S.ok = false;
  if (!S.rates) await updateFx();
  renderPrices(); renderChart(); renderAllTools();
}
async function updateOther(){
  for (const m of ["XAG","XPT","XPD"]){ try { const j = await getJSON("https://api.gold-api.com/price/"+m); if (+j.price>0) S[{XAG:"ag",XPT:"pt",XPD:"pd"}[m]] = +j.price; } catch(e){} }
  renderPrices();
}
/* history */
const ytdDays = () => { const n = new Date(), j = new Date(n.getFullYear(),0,1); return Math.max(2, Math.ceil((n-j)/864e5)+1); };
const RANGES = { D:{iv:"15m",lim:96,ttl:6e4}, W:{iv:"1h",lim:168,ttl:3e5}, M:{iv:"4h",lim:180,ttl:9e5}, Q:{iv:"1d",lim:92,ttl:36e5}, H:{iv:"1d",lim:183,ttl:36e5},
  YTD:{iv:"1d",get lim(){ return ytdDays(); },ttl:36e5}, Y:{iv:"1d",lim:365,ttl:36e5}, "5":{iv:"1w",lim:260,ttl:36e5}, MAX:{iv:"1w",lim:1000,ttl:36e5} };
const RANGE_ORDER = ["D","W","M","Q","H","YTD","Y","5","MAX"];
const RANGE_KEY = {D:"rangeD",W:"rangeW",M:"rangeM",Q:"rangeQ",H:"rangeH",YTD:"rangeYTD",Y:"rangeY","5":"range5",MAX:"rangeMAX"};
const UNITS = {g:1, oz:OZ, kg:1000};
const FXSYM = { EUR:["EURUSDT","div"], GBP:["GBPUSDT","div"], TRY:["USDTTRY","mul"], USD:null };
async function klines(sym, iv, lim){
  let err; for (const b of BIN){ try { const j = await getJSON(`${b}/api/v3/klines?symbol=${sym}&interval=${iv}&limit=${lim}`); if (Array.isArray(j) && j.length) return j.map(k=>({o:k[0], t:Math.min(k[6], Date.now()), c:+k[4]})); } catch(e){ err = e; } }
  throw err || new Error("klines");
}
async function loadHist(r, c){
  const key = r+"|"+c, h = S.hist[key], R = RANGES[r];
  if (h && (h.err ? Date.now()-h.at < 6e4 : Date.now()-h.at < R.ttl)) return;
  if (h && h.loading) return;
  S.hist[key] = Object.assign(h||{}, {loading:true});
  try {
    const fs = FXSYM[c];
    const [pax, fx] = await Promise.all([klines("PAXGUSDT", R.iv, R.lim), fs ? klines(fs[0], R.iv, R.lim) : Promise.resolve(null)]);
    const fm = new Map(fx ? fx.map(k=>[k.o, k.c]) : []); let last = fx && fx.length ? fx[0].c : null;
    const pts = pax.map(k=>{ let f = 1; if (fs){ const v = fm.get(k.o) ?? last; if (v) last = v; f = fs[1]==="div" ? 1/v : v; } return [k.t, k.c * f / OZ]; }).filter(p=>isFinite(p[1]) && p[1]>0);
    S.hist[key] = {pts, at:Date.now(), err:false, loading:false};
  } catch(e){ S.hist[key] = {pts:h&&h.pts||null, at:Date.now(), err:true, loading:false}; }
  if (r==="D" && c===cur) renderPrices();
  renderChart();
}
function histPts(r, c){
  const h = S.hist[r+"|"+c]; if (!h || !h.pts || !h.pts.length) return null;
  const g = c===cur ? gramCur() : null, L = h.pts[h.pts.length-1][1];
  const k = (g && g/L > .95 && g/L < 1.05) ? g/L : 1;
  const pts = h.pts.map(p=>[p[0], p[1]*k]); if (g) pts.push([Date.now(), g]); return pts;
}
/* market hours (New York time): Sun 18:00 – Fri 17:00, daily break 17:00–18:00 */
function nyParts(d){ const f = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",hour12:false}).formatToParts(d);
  return { wd:f.find(p=>p.type==="weekday").value, h:+f.find(p=>p.type==="hour").value % 24 }; }
function marketOpen(d){ const {wd,h} = nyParts(d); if (wd==="Sat") return false; if (wd==="Sun") return h>=18; if (wd==="Fri") return h<17; return h!==17; }
function nextOpen(){ let d = new Date(); d.setMinutes(0,0,0); for (let i=0;i<24*4;i++){ d = new Date(d.getTime()+36e5); if (marketOpen(d)) return d; } return null; }

/* ---------------- rendering: static texts, selectors, nav ---------------- */
const VIEWS = ["home","value","cost","tax","buy","news","about"];
function applyTexts(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.title = "Fairvio · " + t("tagline").split(" · ")[0];
  $("langSeg").innerHTML = LANGS.map(l=>`<button data-l="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("");
  $("curSeg").innerHTML = CURS.map(c=>`<button data-c="${c}" aria-pressed="${c===cur}">${{EUR:"€",USD:"$",GBP:"£",TRY:"₺"}[c]}<span class="cc"> ${c}</span></button>`).join("");
  $("themeSeg").innerHTML = ["light","dark"].map(m=>`<button data-th="${m}" aria-pressed="${m===effTheme()}" title="${t(m==="light"?"thLight":"thDark")}">${m==="light"?"☀":"☾"}<span class="cc"> ${t(m==="light"?"thLight":"thDark")}</span></button>`).join("");
  $("tabs").innerHTML = VIEWS.map(v=>`<a href="#${v}" data-v="${v}">${t("nav_"+v)}</a>`).join("");
  $("rangeSeg").innerHTML = RANGE_ORDER.map(r=>`<button data-r="${r}" aria-pressed="${r===S.range}">${t(RANGE_KEY[r])}</button>`).join("");
  renderFaq();
  $("unitSeg").innerHTML = ["kg","g","oz"].map(u=>`<button data-u="${u}" aria-pressed="${u===S.unit}">${t({g:"uG",oz:"uOZ",kg:"uKG"}[u])}</button>`).join("");
  $("toolLinks").innerHTML = ["value","cost","tax","buy"].map(v=>`<a href="#${v}"><b>${t("nav_"+v)}</b><span>${t("tool_"+v)}</span></a>`).join("");
  $("taxSeg").innerHTML = TAX_COUNTRIES.map(c=>`<button data-tc="${c}" aria-pressed="${c===taxC}">${t("c"+c)}</button>`).join("");
  $("chartFoot").textContent = t("chartFoot");
  markNav();
}
function markNav(){ const v = currentView(); document.querySelectorAll("#tabs a").forEach(a=> a.dataset.v===v ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current")); }
function currentView(){ const h = location.hash.slice(1); return VIEWS.includes(h) ? h : "home"; }
function route(){ const v = currentView(); VIEWS.forEach(x=> $("v-"+x).hidden = x!==v); markNav(); if (v==="home") requestAnimationFrame(renderChart); if (v==="news") loadNews(); window.scrollTo({top:0}); }
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;

/* ---------------- cost calculator ---------------- */
// buy/sell in %, store in % per year, min = minimum storage per year in EUR (converted), freq: m=monthly, y=yearly, o=once
const ROUTES_DEF = [
  {id:"etc",   buy:.5, sell:.5, store:.25, min:0},
  {id:"app",   buy:.75, sell:.75, store:0, min:0},
  {id:"vault", buy:.5, sell:.5, store:.15, min:45},
  {id:"plan",  buy:3, sell:2, store:.6, min:0},
  {id:"coin",  buy:4, sell:2, store:0, min:0, freq:"y"},
  {id:"gram",  buy:15, sell:5, store:0, min:0},
];
let ROUTES = JSON.parse(JSON.stringify(ROUTES_DEF));
try { const s = JSON.parse(localStorage.getItem("fairvio-cost")||"null"); if (s && Array.isArray(s.r) && s.r.length===ROUTES_DEF.length) ROUTES = s.r; if (s && s.mode){ $("cMode").value = s.mode; $("cAmt").value = s.amt; $("cYears").value = s.years; } } catch(e){}
const saveC = () => { try { localStorage.setItem("fairvio-cost", JSON.stringify({r:ROUTES, mode:$("cMode").value, amt:$("cAmt").value, years:$("cYears").value})); } catch(e){} };
function simulate(rt, mode, amt, years){
  const months = Math.round(years*12); let gold = 0 /* value in money, price constant */, cash = 0, paid = 0;
  const minMonthly = (rt.min||0) * (S.rates ? S.rates[cur] : 1) / 12;
  const once = mode==="o"; const isCoinYearly = rt.freq==="y" && !once;
  const buy = (money) => { gold += money / (1 + rt.buy/100); };
  for (let m=0; m<months; m++){
    if (once){ if (m===0){ paid += amt; buy(amt); } }
    else { paid += amt; if (isCoinYearly){ cash += amt; if ((m+1)%12===0){ buy(cash); cash = 0; } } else buy(amt); }
    if (gold>0){ const fee = Math.max(gold * rt.store/100/12, minMonthly); gold = Math.max(0, gold - fee); }
  }
  if (cash>0){ buy(cash); cash = 0; }   // remaining savings for the yearly coin bought at the end
  const end = gold * (1 - rt.sell/100);
  return {paid, end, cost: paid - end};
}
function renderCost(){
  const mode = $("cMode").value, amt = parseNum($("cAmt").value), years = Math.min(50, Math.max(1, Math.round(parseNum($("cYears").value)||0)));
  $("cAmtL").textContent = t(mode==="m"?"costAmtM":"costAmtO", cur);
  const ok = isFinite(amt) && amt>0;
  $("cHead").textContent = t("costHead", years);
  if (!ok){ $("cBars").innerHTML = ""; $("cInvested").textContent = ""; return; }
  const list = ROUTES.map(rt=>{ const id = (rt.id==="coin" && mode==="o") ? "coin_once" : rt.id; return {rt, id, ...simulate(rt, mode, amt, years)}; }).sort((a,b)=>a.cost-b.cost);
  const max = Math.max(...list.map(l=>l.cost), 1);
  $("cInvested").textContent = t("costInvested", money(list[0].paid, 0));
  $("cBars").innerHTML = list.map((l,i)=>`<div class="brow${i===0?" best":""}">
      <div class="lbl"><b>${t("r_"+l.id)}${i===0?`<span class="tag best">${t("costBest")}</span>`:""}</b><span>${t("r_"+l.id+"_d")}</span></div>
      <div class="track"><i style="width:${Math.max(2, l.cost/max*100)}%"></i></div>
      <div class="val">${money(l.cost, 0)}<small>${pctN(l.cost/l.paid*100,1)} · ${t("costKeep", money(l.end, 0))}</small></div></div>`).join("");
  saveC();
}

// Regels 2026 per land. Elke taal kan elk land kiezen; de standaard volgt de taal.
const TAX_COUNTRIES = ["DE","NL","BE","AT","UK","CH","TR"];
let taxC = {nl:"NL", de:"DE", en:"DE", tr:"DE"}[lang] || "DE";
const iso = d => d.toISOString().slice(0,10);
const today = new Date(), eightAgo = new Date(today); eightAgo.setMonth(eightAgo.getMonth()-8);
const TX = {}; // waarden per veld, gedeeld tussen landen
const txDefaults = {prod:"phys", buyD:iso(eightAgo), sellD:iso(today), buyA:"5000", sellA:"6200", other:"0", rate:"30", allow:"1000",
  nlGold:"20000", nlBank:"30000", nlInv:"0", nlDebt:"0", nlPartner:"no", beProd:"inv", beBuy:"5000", beSell:"18000", beEx:"10000",
  ukProd:"bar", ukBuy:"5000", ukSell:"14000", ukAea:"3000", ukBand:"basic"};
Object.assign(TX, txDefaults);
const F = {
  date:(k,lab)=>`<label><span>${t(lab)}</span><input type="date" data-tx="${k}" value="${TX[k]}"></label>`,
  num:(k,lab,arg)=>`<label><span>${t(lab,arg)}</span><input class="num" data-tx="${k}" inputmode="decimal" value="${TX[k]}"></label>`,
  sel:(k,lab,opts)=>`<label><span>${t(lab)}</span><select data-tx="${k}">${opts.map(([v,l])=>`<option value="${v}"${TX[k]===v?" selected":""}>${t(l)}</option>`).join("")}</select></label>`,
};
function addYear(d){ const x = new Date(d); x.setFullYear(x.getFullYear()+1); return x; }
const eur = v => moneyIn(v, "EUR"), gbp = v => moneyIn(v, "GBP");
const n0 = k => { const v = parseNum(TX[k]); return isFinite(v) ? v : NaN; };
// --- Duitsland en Oostenrijk: speculatietermijn van één jaar
function holdCalc(cfg){
  const etf = TX.prod==="etf";
  const bd = new Date(TX.buyD+"T12:00:00"), sd = new Date(TX.sellD+"T12:00:00"), ba = n0("buyA"), sa = n0("sellA");
  if (isNaN(bd)||isNaN(sd)||sd<bd||!isFinite(ba)||!isFinite(sa)) return {expl:t("tExplDates")};
  const days = Math.round((sd-bd)/864e5), gain = sa-ba, freeFrom = new Date(addYear(bd).getTime()+864e5);
  const kv = [[t("tHold"), t("tDays", days)], [t("tGain"), eur(gain)]]; let tax = 0, v, e;
  if (gain<=0){ v = t("tLoss"); e = t("tExplLoss"); }
  else if (etf){ const base = cfg.etfAllow ? Math.max(0, gain - Math.max(0, n0("allow")||0)) : gain; tax = base*cfg.etfRate; v = tax>0 ? t("tTaxed", eur(tax)) : t("tFree"); e = t(cfg.etfExpl); }
  else if (sd > addYear(bd)){ v = t("tFree"); e = t(cfg.freeExpl); }
  else if (gain + Math.max(0, n0("other")||0) < cfg.limit){ v = t("tFree"); e = t(cfg.underExpl); kv.push([t("tFreeFrom"), freeFrom.toLocaleDateString(loc())]); }
  else { const r = n0("rate"); tax = gain*(isFinite(r)?Math.min(55,Math.max(0,r)):30)/100; v = t("tTaxed", eur(tax)); e = t(cfg.taxExpl); kv.push([t("tFreeFrom"), freeFrom.toLocaleDateString(loc())]); }
  kv.push([t("tNet"), eur(sa-tax)]); return {v, kv, e, tax};
}
const COUNTRY = {
  DE:{ fields:()=>[F.sel("prod","tProd",[["phys","tPhys"],["etf","tEtf"]]), F.date("buyD","tBuyDate"), F.date("sellD","tSellDate"), F.num("buyA","tBuyAmt"), F.num("sellA","tSellAmt"),
        TX.prod==="etf" ? F.num("allow","tAllow") : F.num("other","tOther"), TX.prod==="etf" ? "" : F.num("rate","tRate")].join(""),
       calc:()=>holdCalc({limit:1000, etfRate:.26375, etfAllow:true, etfExpl:"tExplEtf", freeExpl:"tExplFree", underExpl:"tExplUnder", taxExpl:"tExplTax"}) },
  AT:{ fields:()=>[F.sel("prod","tProd",[["phys","atPhys"],["etf","atEtf"]]), F.date("buyD","tBuyDate"), F.date("sellD","tSellDate"), F.num("buyA","tBuyAmt"), F.num("sellA","tSellAmt"),
        TX.prod==="etf" ? "" : F.num("other","tOther"), TX.prod==="etf" ? "" : F.num("rate","tRate")].join(""),
       calc:()=>holdCalc({limit:440, etfRate:.275, etfAllow:false, etfExpl:"atExplEtf", freeExpl:"atExplFree", underExpl:"atExplUnder", taxExpl:"atExplTax"}) },
  NL:{ fields:()=>[F.num("nlGold","nlGold"), F.num("nlBank","nlBank"), F.num("nlInv","nlInv"), F.num("nlDebt","nlDebt"), F.sel("nlPartner","nlPartner",[["no","no"],["yes","yes"]])].join(""),
       calc:()=>{
         const p = TX.nlPartner==="yes" ? 2 : 1, free = 59357*p, drempel = 3800*p;
         const g = Math.max(0,n0("nlGold")||0), bank = Math.max(0,n0("nlBank")||0), inv = Math.max(0,n0("nlInv")||0), debt = Math.max(0,n0("nlDebt")||0);
         const box3 = (gold) => { const debtC = Math.max(0, debt - drempel); const base = bank + inv + gold - debtC; if (base<=0) return 0;
           const ret = bank*.0128 + (inv+gold)*.06 - debtC*.027; const pctR = Math.max(0, ret/base); return Math.max(0, base - free) * pctR * .36; };
         const all = box3(g), without = box3(0), part = all - without;
         const kv = [[t("nlFree"), eur(free)], [t("nlTotal"), eur(all)], [t("nlGoldPart"), eur(part)], [t("nlPerYear"), g>0 ? pctN(part/g*100,2) : "—"]];
         return {v: all>0 ? t("tTaxed", eur(all)) : t("nlNone"), kv, e: t("nlExpl"), tax: all};
       } },
  BE:{ fields:()=>[F.sel("beProd","tProd",[["inv","beInv"],["jew","beJew"]]), TX.beProd==="jew" ? "" : F.num("beBuy","beBuy"), TX.beProd==="jew" ? "" : F.num("beSell","beSell"), TX.beProd==="jew" ? "" : F.num("beEx","beEx")].join(""),
       calc:()=>{
         if (TX.beProd==="jew") return {v:t("tFree"), kv:[], e:t("beExplJew"), tax:0};
         const ba = n0("beBuy"), sa = n0("beSell"), ex = Math.max(0, n0("beEx")||0); if (!isFinite(ba)||!isFinite(sa)) return {expl:t("tExplDates")};
         const gain = sa-ba; if (gain<=0) return {v:t("tLoss"), kv:[[t("tGain"), eur(gain)]], e:t("tExplLoss"), tax:0};
         const tax = Math.max(0, gain-ex)*.10;
         return {v: tax>0 ? t("tTaxed", eur(tax)) : t("tFree"), kv:[[t("tGain"), eur(gain)], [t("beFreeUsed"), eur(Math.min(gain, ex))], [t("tNet"), eur(sa-tax)]], e:t(tax>0?"beExplTax":"beExplFree"), tax};
       } },
  UK:{ fields:()=>[F.sel("ukProd","tProd",[["legal","ukLegal"],["bar","ukBar"],["jew","ukJew"]]), F.num("ukBuy","ukBuy"), F.num("ukSell","ukSell"),
        TX.ukProd==="legal" ? "" : F.num("ukAea","ukAea"), TX.ukProd==="legal" ? "" : F.sel("ukBand","ukBand",[["basic","ukBasic"],["higher","ukHigher"]])].join(""),
       calc:()=>{
         const ba = n0("ukBuy"), sa = n0("ukSell"), aea = Math.max(0, n0("ukAea")||0); if (!isFinite(ba)||!isFinite(sa)) return {expl:t("tExplDates")};
         let gain = sa-ba; const kv = [[t("tGain"), gbp(gain)]];
         if (gain<=0) return {v:t("tLoss"), kv, e:t("tExplLoss"), tax:0};
         if (TX.ukProd==="legal") return {v:t("tFree"), kv, e:t("ukExplLegal"), tax:0};
         if (TX.ukProd==="jew"){ if (sa<=6000) return {v:t("tFree"), kv, e:t("ukExplChattel"), tax:0}; gain = Math.min(gain, 5/3*(sa-6000)); kv.push([t("ukCapped"), gbp(gain)]); }
         const tax = Math.max(0, gain-aea) * (TX.ukBand==="higher" ? .24 : .18);
         kv.push([t("tNet"), gbp(sa-tax)]);
         return {v: tax>0 ? t("tTaxed", gbp(tax)) : t("tFree"), kv, e:t(TX.ukProd==="jew" ? "ukExplJew" : "ukExplBar"), tax};
       } },
  CH:{ info:"ch" }, TR:{ info:"tr" },
};

const NEWS_URLS = ["https://raw.githubusercontent.com/klcfurkan/goudprijs/data/news.json", "../news.json"];

async function loadNews(force){
  if (!force && Date.now()-newsAt < 3e5 && S.news) { renderNews(); return; }
  for (const u of NEWS_URLS){ try { const j = await getJSON(u + (u.startsWith("http") ? "?t="+Math.floor(Date.now()/6e4) : "")); if (j && Array.isArray(j.items)){ S.news = j; S.newsErr = false; newsAt = Date.now(); break; } } catch(e){ S.newsErr = true; } }

function ago(sec){ const d = Date.now()/1000 - sec, rtf = new Intl.RelativeTimeFormat(loc(), {numeric:"auto"});
  if (d<3600) return rtf.format(-Math.max(1, Math.round(d/60)), "minute"); if (d<86400) return rtf.format(-Math.round(d/3600), "hour"); return rtf.format(-Math.round(d/86400), "day"); }
function renderNews(){

  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("nList").innerHTML = items.length ? items.map(i=>`<a href="${esc(i.u)}" target="_blank" rel="noopener"><b>${esc(i.t)}</b><span class="meta"><span class="cat">${T["cat_"+i.cat] ? t("cat_"+i.cat) : esc(i.cat)}</span><span>${esc(i.s)}</span><span>${ago(i.ts)}</span><span>${String(i.lang||"").toUpperCase()}</span></span></a>`).join("") : `<p class="muted">${t("nEmpty")}</p>`;
