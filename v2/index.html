<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valoro · Goud, eerlijk uitgelegd</title>
<meta name="description" content="Live goudprijs, wat je goud waard is, de goedkoopste manier om goud te bezitten en de belastingregels. Prototype.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#16181d; --soft:#3d424b; --muted:#6b7280; --rule:#e4e1d8;
  --gold:#b8860b; --gold-2:#e8b830; --gold-bg:#fbf3dd; --up:#0f8a4f; --down:#c62a47; --focus:#2563eb;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0e0f12; --card:#16181d; --ink:#f3f4f6; --soft:#d1d5db; --muted:#9ca3af; --rule:#2a2d34;
         --gold:#e8b830; --gold-2:#e8b830; --gold-bg:#2a2410; --up:#31d17f; --down:#ff6b85; color-scheme:dark; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--gold);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:12.5px}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4vw,36px);font-weight:700}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:-2px}
.sel{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;background:var(--card);padding:2px}
.seg button{font:600 12.5px var(--font);border:0;background:transparent;color:var(--soft);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
@media (max-width:520px){.seg button{padding:6px 8px}.cc{display:none}.sel{width:100%;justify-content:space-between}}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--soft);font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px}
nav.tabs a[aria-current="page"]{background:var(--gold-bg);color:var(--ink)}

main.wrap{padding-top:28px;padding-bottom:64px;display:flex;flex-direction:column;gap:28px}
section.view{display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-direction:column;gap:6px}
.head p{color:var(--soft);max-width:70ch}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px;min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:640px){.g2{grid-template-columns:1fr}}

/* stats */
.stat{display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:600 clamp(20px,2.6vw,26px) var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .s{font-size:13px;color:var(--muted)}
.stat.hero .v{font-size:clamp(30px,5vw,44px);color:var(--ink)}
.up{color:var(--up)} .down{color:var(--down)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--rule)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.open .dot{background:var(--up)} .pill.closed .dot{background:var(--down)} .pill.err .dot{background:var(--down)}
.statusrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* chart */
.chartbox{position:relative;height:300px}
.chartbox canvas{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%)}
.charthead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chartmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}

/* forms */
label{font-size:13.5px;font-weight:600;color:var(--soft);display:flex;flex-direction:column;gap:6px;min-width:0}
input,select{font:500 15px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input.num{font-family:var(--mono)}
.btn{font:600 14px var(--font);border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.icon{padding:8px 10px;line-height:1}
.row{display:grid;gap:10px;align-items:end}
.vrow{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto}
@media (max-width:640px){.vrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.vrow .out{grid-column:1}.vrow .rm{grid-column:2;justify-self:end}}
.out{font:600 16px var(--mono);padding:10px 0;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:14px;margin-top:6px}
.total .big{font:700 clamp(24px,3.4vw,32px) var(--mono)}
.note{border-left:3px solid var(--gold-2);background:var(--gold-bg);padding:10px 14px;border-radius:0 10px 10px 0;color:var(--soft);font-size:14.5px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

/* cost bars */
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) auto;gap:12px;align-items:center}
@media (max-width:640px){.brow{grid-template-columns:1fr auto}.brow .track{grid-column:1/-1;order:3}}
.brow .lbl b{display:block;font-size:15px}
.brow .lbl span{font-size:13px;color:var(--muted)}
.track{height:12px;background:var(--bg);border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--gold-2);border-radius:999px}
.brow.best .track i{background:var(--up)}
.brow .val{text-align:right;font:600 15px var(--mono);white-space:nowrap}
.brow .val small{display:block;font:500 12px var(--font);color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gold-bg);color:var(--ink);margin-left:6px;vertical-align:2px}
.tag.best{background:color-mix(in srgb,var(--up) 18%,transparent)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;background:color-mix(in srgb,var(--bg) 60%,var(--card))}
td.r,th.r{text-align:right;white-space:nowrap}
.assume table{min-width:640px}
.assume input{padding:6px 8px;font-size:14px;width:84px}
details summary{cursor:pointer;font-weight:600;color:var(--soft)}
details[open] summary{margin-bottom:12px}

/* result box */
.result{display:flex;flex-direction:column;gap:8px}
.verdict{font-size:20px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right}

/* news */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--font);border:1px solid var(--rule);background:var(--card);color:var(--soft);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.news{display:flex;flex-direction:column}
.news a{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.news a:last-child{border-bottom:0}
.news a b{font-weight:600;font-size:15.5px}
.news .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.cat{font-weight:700;color:var(--gold)}

.links{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.links a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px}
.links a:hover{border-color:var(--gold-2)}
.links a span{color:var(--muted);font-size:14px}
.dealers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.dealers ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
footer.wrap{border-top:1px solid var(--rule);padding-top:24px;padding-bottom:40px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#home">
        <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#16181d"/><path d="M10 40 L20 22 H50 L56 40 Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 40 V46 H56 V40" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><path d="M17 36 L26 32 L32 34.5 L40 27 L47 29" fill="none" stroke="#e8b830" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="29" r="3.2" fill="#e8b830"/></svg>
        <span><b>Valoro</b><small data-t="tagline"></small></span>
      </a>
      <div class="sel">
        <div class="seg" id="langSeg" role="group" aria-label="Language"></div>
        <div class="seg" id="curSeg" role="group" aria-label="Currency"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <!-- HOME -->
  <section class="view" id="v-home">
    <div class="head">
      <h1 data-t="homeTitle"></h1>
      <p data-t="homeLead"></p>
    </div>
    <div class="statusrow">
      <span class="pill" id="livePill"><span class="dot"></span><span id="liveText">…</span></span>
      <span class="pill" id="mktPill"><span class="dot"></span><span id="mktText">…</span></span>
      <span class="xs muted" id="srcText"></span>
    </div>
    <div class="grid g4">
      <div class="card stat hero"><span class="k" data-t="perGram"></span><span class="v" id="pGram">—</span><span class="s" id="pGramS"></span></div>
      <div class="card stat"><span class="k" data-t="perOz"></span><span class="v" id="pOz">—</span><span class="s" data-t="ozNote"></span></div>
      <div class="card stat"><span class="k" data-t="perKg"></span><span class="v" id="pKg">—</span><span class="s" data-t="kgNote"></span></div>
      <div class="card stat"><span class="k" data-t="ch24"></span><span class="v" id="pCh">—</span><span class="s" id="pChS"></span></div>
    </div>
    <div class="card">
      <div class="charthead">
        <h3 id="chartTitle"></h3>
        <div class="seg" id="rangeSeg" role="group" aria-label="Range"></div>
      </div>
      <div class="chartbox" id="chartBox"><canvas id="chart"></canvas><div class="chartmsg" id="chartMsg"></div><div class="tip" id="tip" hidden></div></div>
      <p class="xs muted" style="margin-top:8px" id="chartFoot"></p>
    </div>
    <div class="grid g3">
      <div class="card stat"><span class="k" data-t="silver"></span><span class="v" id="pAg">—</span><span class="s" data-t="perOzShort"></span></div>
      <div class="card stat"><span class="k" data-t="platinum"></span><span class="v" id="pPt">—</span><span class="s" data-t="perOzShort"></span></div>
      <div class="card stat"><span class="k" id="fxK"></span><span class="v" id="pFx">—</span><span class="s" data-t="fxNote"></span></div>
    </div>
    <h2 data-t="toolsTitle"></h2>
    <div class="links" id="toolLinks"></div>
  </section>

  <!-- VALUE -->
  <section class="view" id="v-value" hidden>
    <div class="head"><h1 data-t="valTitle"></h1><p data-t="valLead"></p></div>
    <div class="card">
      <div id="vRows" style="display:flex;flex-direction:column;gap:12px"></div>
      <div style="margin-top:12px"><button class="btn" id="vAdd" data-t="valAdd"></button></div>
      <div class="total">
        <span><b data-t="valTotal"></b><br><span class="small muted" data-t="valTotalNote"></span></span>
        <span class="big" id="vTotal">—</span>
      </div>
      <div class="total" style="border-top:0;padding-top:4px">
        <span class="small" data-t="valFair"></span>
        <span class="num" id="vFair">—</span>
      </div>
    </div>
    <p class="note" data-t="valTip"></p>
  </section>

  <!-- COST -->
  <section class="view" id="v-cost" hidden>
    <div class="head"><h1 data-t="costTitle"></h1><p data-t="costLead"></p></div>
    <div class="card">
      <div class="fields">
        <label><span data-t="costMode"></span>
          <select id="cMode"><option value="m" data-t="costMonthly"></option><option value="o" data-t="costOnce"></option></select></label>
        <label><span id="cAmtL"></span><input class="num" id="cAmt" inputmode="decimal" value="100"></label>
        <label><span data-t="costYears"></span><input class="num" id="cYears" inputmode="numeric" value="10"></label>
      </div>
    </div>
    <div class="card">
      <div class="charthead"><h3 id="cHead"></h3><span class="small muted" id="cInvested"></span></div>
      <div class="bars" id="cBars"></div>
      <p class="xs muted" style="margin-top:14px" data-t="costAssume"></p>
    </div>
    <div class="card assume">
      <details>
        <summary data-t="costEdit"></summary>
        <div class="tbl"><table id="cTable"></table></div>
        <p class="xs muted" style="margin-top:10px" data-t="costSrc"></p>
        <div style="margin-top:10px"><button class="btn" id="cReset" data-t="costReset"></button></div>
      </details>
    </div>
    <p class="note" data-t="costNote"></p>
  </section>

  <!-- TAX -->
  <section class="view" id="v-tax" hidden>
    <div class="head"><h1 data-t="taxTitle"></h1><p data-t="taxLead"></p></div>
    <div class="seg" id="taxSeg" role="group" aria-label="Country" style="align-self:flex-start"></div>
    <div id="taxDE" class="grid g2">
      <div class="card">
        <div class="fields">
          <label><span data-t="tProd"></span>
            <select id="tProd"><option value="phys" data-t="tPhys"></option><option value="etf" data-t="tEtf"></option></select></label>
          <label><span data-t="tBuyDate"></span><input type="date" id="tBuyD"></label>
          <label><span data-t="tSellDate"></span><input type="date" id="tSellD"></label>
          <label><span data-t="tBuyAmt"></span><input class="num" id="tBuyA" inputmode="decimal" value="5000"></label>
          <label><span data-t="tSellAmt"></span><input class="num" id="tSellA" inputmode="decimal" value="6200"></label>
          <label id="tOtherL"><span data-t="tOther"></span><input class="num" id="tOther" inputmode="decimal" value="0"></label>
          <label id="tRateL"><span data-t="tRate"></span><input class="num" id="tRate" inputmode="decimal" value="30"></label>
          <label id="tAllowL" hidden><span data-t="tAllow"></span><input class="num" id="tAllow" inputmode="decimal" value="1000"></label>
        </div>
      </div>
      <div class="card result">
        <span class="small muted" data-t="tResult"></span>
        <span class="verdict" id="tVerdict">—</span>
        <dl class="kv" id="tKv"></dl>
        <p class="small muted" id="tExplain"></p>
      </div>
    </div>
    <div id="taxNL" class="card" hidden><div class="result"><h3 data-t="nlTitle"></h3><p data-t="nlBody"></p></div></div>
    <div id="taxUK" class="card" hidden><div class="result"><h3 data-t="ukTitle"></h3><p data-t="ukBody"></p></div></div>
    <p class="note" data-t="taxNote"></p>
  </section>

  <!-- BUY -->
  <section class="view" id="v-buy" hidden>
    <div class="head"><h1 data-t="buyTitle"></h1><p data-t="buyLead"></p></div>
    <p class="note" data-t="buyPhase"></p>
    <div class="card">
      <div class="tbl"><table id="bTable"></table></div>
      <p class="xs muted" style="margin-top:10px" data-t="buyFoot"></p>
    </div>
    <h2 data-t="buyDealers"></h2>
    <p class="small muted" data-t="buyDealersNote"></p>
    <div class="dealers" id="bDealers"></div>
  </section>

  <!-- NEWS -->
  <section class="view" id="v-news" hidden>
    <div class="head"><h1 data-t="newsTitle"></h1><p data-t="newsLead"></p></div>
    <div class="filters" id="nFilters"></div>
    <div class="card"><div class="news" id="nList"></div><p class="xs muted" id="nUpd" style="margin-top:10px"></p></div>
  </section>

  <!-- ABOUT -->
  <section class="view" id="v-about" hidden>
    <div class="head"><h1 data-t="aboutTitle"></h1></div>
    <div class="grid g2">
      <div class="card result"><h3 data-t="aboutWho"></h3><p data-t="aboutWhoBody"></p></div>
      <div class="card result"><h3 data-t="aboutMoney"></h3><p data-t="aboutMoneyBody"></p></div>
      <div class="card result"><h3 data-t="aboutData"></h3><p data-t="aboutDataBody"></p></div>
      <div class="card result"><h3 data-t="aboutLegal"></h3><p data-t="aboutLegalBody"></p></div>
    </div>
  </section>
</main>

<footer class="wrap">
  <p data-t="foot1"></p>
  <p data-t="foot2"></p>
</footer>

<script>
(()=>{
"use strict";
const $ = id => document.getElementById(id);
const OZ = 31.1034768;            // gram per troy ounce
const LANGS = ["nl","en","de","tr"];
const LOCALE = {nl:"nl-NL", en:"en-GB", de:"de-DE", tr:"tr-TR"};
const CURS = ["EUR","USD","GBP","TRY"];

/* ---------------- texts ---------------- */
const T = {
tagline:{nl:"Goud en geld, eerlijk uitgelegd · door Furkan Kilic",en:"Gold and money, explained honestly · by Furkan Kilic",de:"Gold und Geld, ehrlich erklärt · von Furkan Kilic",tr:"Altın ve para, dürüstçe anlatıldı · Furkan Kilic"},
nav_home:{nl:"Goudprijs",en:"Gold price",de:"Goldpreis",tr:"Altın fiyatı"},
nav_value:{nl:"Wat is mijn goud waard?",en:"What is my gold worth?",de:"Was ist mein Gold wert?",tr:"Altınım ne eder?"},
nav_cost:{nl:"Goedkoopste manier",en:"Cheapest way",de:"Günstigster Weg",tr:"En ucuz yol"},
nav_tax:{nl:"Belasting",en:"Tax",de:"Steuern",tr:"Vergi"},
nav_buy:{nl:"Waar kopen",en:"Where to buy",de:"Wo kaufen",tr:"Nereden alınır"},
nav_news:{nl:"Nieuws",en:"News",de:"Nachrichten",tr:"Haberler"},
nav_about:{nl:"Over",en:"About",de:"Über uns",tr:"Hakkında"},

tExplFree:{nl:"Je hield het goud langer dan één jaar. Dan is de winst in Duitsland belastingvrij (§ 23 EStG).",en:"You held the gold for more than one year. In Germany the gain is then tax-free (§ 23 EStG).",de:"Du hast das Gold länger als ein Jahr gehalten. Dann ist der Gewinn steuerfrei (§ 23 EStG).",tr:"Altını bir yıldan uzun tuttun. Almanya'da kazanç bu durumda vergiden muaftır (§ 23 EStG)."},
tExplUnder:{nl:"Binnen een jaar verkocht, maar je totale winst uit privéverkopen dit jaar blijft onder € 1.000. Dan betaal je niets (vrijgrens).",en:"Sold within a year, but your total private-sale gains this year stay below €1,000. Then you pay nothing (exemption limit).",de:"Innerhalb eines Jahres verkauft, aber deine gesamten privaten Veräußerungsgewinne bleiben dieses Jahr unter 1.000 €. Dann zahlst du nichts (Freigrenze).",tr:"Bir yıl içinde sattın, ama bu yılki toplam özel satış kazancın 1.000 €'nun altında. Bu durumda vergi yok (muafiyet sınırı)."},
tExplTax:{nl:"Binnen een jaar verkocht en je totale winst uit privéverkopen is € 1.000 of meer. Dan is de hele winst belast tegen je persoonlijke tarief (zonder kerkbelasting). Wacht je tot de datum hieronder, dan is het belastingvrij.",en:"Sold within a year and your total private-sale gains are €1,000 or more. Then the whole gain is taxed at your personal rate (excluding church tax). If you wait until the date below, it is tax-free.",de:"Innerhalb eines Jahres verkauft und deine privaten Veräußerungsgewinne liegen bei 1.000 € oder mehr. Dann ist der ganze Gewinn mit deinem persönlichen Steuersatz zu versteuern (ohne Kirchensteuer). Wartest du bis zum Datum unten, ist er steuerfrei.",tr:"Bir yıl içinde sattın ve toplam özel satış kazancın 1.000 € veya fazla. Bu durumda kazancın tamamı kişisel oranından vergilendirilir (kilise vergisi hariç). Aşağıdaki tarihe kadar beklersen vergisiz olur."},
tExplEtf:{nl:"Een goud-ETF zonder leveringsrecht is in Duitsland altijd belast met afgeltingsheffing: 25% plus 5,5% solidariteitstoeslag (zonder kerkbelasting), na de Sparer-Pauschbetrag van € 1.000. Hoe lang je het hield maakt niet uit.",en:"A gold ETF without a delivery right is always taxed in Germany with flat-rate withholding tax: 25% plus 5.5% solidarity surcharge (without church tax), after the €1,000 saver's allowance. The holding period does not matter.",de:"Ein Gold-ETF ohne Lieferanspruch unterliegt immer der Abgeltungsteuer: 25 % plus 5,5 % Solidaritätszuschlag (ohne Kirchensteuer), nach dem Sparer-Pauschbetrag von 1.000 €. Die Haltedauer spielt keine Rolle.",tr:"Teslim hakkı olmayan bir altın ETF'i Almanya'da her zaman stopaj vergisine tabidir: %25 artı %5,5 dayanışma vergisi (kilise vergisi hariç), 1.000 € tasarruf muafiyetinden sonra. Elde tutma süresi önemli değildir."},
tExplLoss:{nl:"Je verkocht met verlies. Dan betaal je geen belasting.",en:"You sold at a loss. Then you pay no tax.",de:"Du hast mit Verlust verkauft. Dann zahlst du keine Steuer.",tr:"Zararına sattın. Bu durumda vergi ödemezsin."},
tExplDates:{nl:"Vul geldige data in (verkoop na aankoop).",en:"Enter valid dates (sale after purchase).",de:"Gib gültige Daten ein (Verkauf nach Kauf).",tr:"Geçerli tarihler gir (satış alıştan sonra)."},
nlTitle:{nl:"Nederland: geen belasting bij verkoop",en:"Netherlands: no tax when selling",de:"Niederlande: keine Steuer beim Verkauf",tr:"Hollanda: satışta vergi yok"},
nlBody:{nl:"In Nederland betaal je geen belasting over de winst als je goud verkoopt. Goud telt wel mee in box 3: de waarde op 1 januari hoort bij je vermogen, en daarover kan vermogensbelasting gelden boven het heffingsvrije vermogen. Beleggingsgoud (baren en munten van minstens 99,5% en 90% zuiver) is vrij van btw.",en:"In the Netherlands you pay no tax on the gain when you sell gold. Gold does count in box 3: its value on 1 January is part of your wealth, which may be taxed above the tax-free allowance. Investment gold (bars and coins of at least 99.5% and 90% purity) is exempt from VAT.",de:"In den Niederlanden zahlst du beim Verkauf von Gold keine Steuer auf den Gewinn. Gold zählt aber in „Box 3“: Sein Wert am 1. Januar gehört zu deinem Vermögen, auf das oberhalb des Freibetrags Vermögensteuer anfallen kann. Anlagegold (Barren ab 99,5 % und Münzen ab 90 % Feinheit) ist mehrwertsteuerfrei.",tr:"Hollanda'da altın satınca kazanç üzerinden vergi ödemezsin. Ancak altın 3. kutuda (box 3) sayılır: 1 Ocak'taki değeri servetinin parçasıdır ve vergisiz sınırın üzerinde servet vergisi çıkabilir. Yatırım altını (en az %99,5 saflıkta külçe ve %90 saflıkta sikke) KDV'den muaftır."},

ukBody:{nl:"Britse munten die wettig betaalmiddel zijn, zoals de Sovereign en de Britannia, zijn vrijgesteld van vermogenswinstbelasting (CGT). Voor baren en buitenlandse munten geldt CGT over winst boven de jaarlijkse vrijstelling van £ 3.000. Beleggingsgoud is vrij van btw.",en:"British coins that are legal tender, such as the Sovereign and the Britannia, are exempt from Capital Gains Tax (CGT). For bars and foreign coins, CGT applies to gains above the annual exempt amount of £3,000. Investment gold is exempt from VAT.",de:"Britische Münzen mit gesetzlichem Zahlungsmittelstatus, etwa Sovereign und Britannia, sind von der Kapitalertragsteuer (CGT) befreit. Für Barren und ausländische Münzen gilt CGT auf Gewinne über dem jährlichen Freibetrag von 3.000 £. Anlagegold ist mehrwertsteuerfrei.",tr:"Sovereign ve Britannia gibi yasal ödeme aracı olan İngiliz sikkeleri sermaye kazancı vergisinden (CGT) muaftır. Külçe ve yabancı sikkelerde yıllık 3.000 £ muafiyetin üzerindeki kazanca CGT uygulanır. Yatırım altını KDV'den muaftır."},

const S = { oz:null, ag:null, pt:null, src:null, at:null, ok:false, fx:null /* units of cur per USD */, rates:null /* per EUR */, hist:{}, range:"D", news:null, newsErr:false, newsCat:"all" };
async function getJSON(url, ms=9000){
  const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), ms);
  try { const r = await fetch(url, {signal:ctl.signal, cache:"no-store"}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(tm); }
}
const BIN = ["https://data-api.binance.vision","https://api.binance.com"];
async function binPrice(sym){ for (const b of BIN){ try { const j = await getJSON(`${b}/api/v3/ticker/price?symbol=${sym}`); if (+j.price>0) return +j.price; } catch(e){} } throw new Error("binance"); }
async function updateFx(){
  const srcs = [
    async()=> (await getJSON("https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD,GBP,TRY")).rates,
    async()=> (await getJSON("https://api.frankfurter.app/latest?from=EUR&to=USD,GBP,TRY")).rates,
    async()=> { const r = (await getJSON("https://open.er-api.com/v6/latest/EUR")).rates; return {USD:r.USD, GBP:r.GBP, TRY:r.TRY}; },
    async()=> { const [e,g,tr] = await Promise.all([binPrice("EURUSDT"), binPrice("GBPUSDT"), binPrice("USDTTRY")]); return {USD:e, GBP:e/g, TRY:e*tr}; },
  ];
  for (const f of srcs){ try { const r = await f(); if (r.USD>0.5 && r.USD<2 && r.GBP>0.4 && r.TRY>1){ S.rates = {EUR:1, USD:+r.USD, GBP:+r.GBP, TRY:+r.TRY}; break; } } catch(e){} }
  renderPrices(); renderAllTools();
}
const perUsd = c => S.rates ? S.rates[c] / S.rates.USD : null;   // units of currency c per 1 USD
const ozCur = () => (S.oz!=null && perUsd(cur)) ? S.oz * perUsd(cur) : null;
const gramCur = () => { const o = ozCur(); return o==null ? null : o / OZ; };
async function updateMetals(){
  let p = null, src = null;
  try { const j = await getJSON("https://api.gold-api.com/price/XAU"); if (+j.price>500 && +j.price<50000){ p = +j.price; src = "gold-api.com"; } } catch(e){}
  if (p==null){ try { const v = await binPrice("PAXGUSDT"); if (v>500 && v<50000){ p = v; src = "Binance PAXG"; } } catch(e){} }
  if (p!=null){ S.oz = p; S.src = src; S.at = new Date(); S.ok = true; } else S.ok = false;
  if (!S.rates) await updateFx();
  renderPrices(); renderChart(); renderAllTools();
}
async function updateOther(){

/* history */
const RANGES = { D:{iv:"15m",lim:96,ttl:6e4}, W:{iv:"1h",lim:168,ttl:3e5}, M:{iv:"4h",lim:180,ttl:9e5}, Y:{iv:"1d",lim:365,ttl:36e5}, "5":{iv:"1w",lim:260,ttl:36e5} };
const FXSYM = { EUR:["EURUSDT","div"], GBP:["GBPUSDT","div"], TRY:["USDTTRY","mul"], USD:null };
async function klines(sym, iv, lim){
  let err; for (const b of BIN){ try { const j = await getJSON(`${b}/api/v3/klines?symbol=${sym}&interval=${iv}&limit=${lim}`); if (Array.isArray(j) && j.length) return j.map(k=>({o:k[0], t:Math.min(k[6], Date.now()), c:+k[4]})); } catch(e){ err = e; } }
  throw err || new Error("klines");
}
async function loadHist(r, c){
  const key = r+"|"+c, h = S.hist[key], R = RANGES[r];
  if (h && (h.err ? Date.now()-h.at < 6e4 : Date.now()-h.at < R.ttl)) return;
  if (h && h.loading) return;
  S.hist[key] = Object.assign(h||{}, {loading:true});
  try {
    const fs = FXSYM[c];
    const [pax, fx] = await Promise.all([klines("PAXGUSDT", R.iv, R.lim), fs ? klines(fs[0], R.iv, R.lim) : Promise.resolve(null)]);
    const fm = new Map(fx ? fx.map(k=>[k.o, k.c]) : []); let last = fx && fx.length ? fx[0].c : null;
    const pts = pax.map(k=>{ let f = 1; if (fs){ const v = fm.get(k.o) ?? last; if (v) last = v; f = fs[1]==="div" ? 1/v : v; } return [k.t, k.c * f / OZ]; }).filter(p=>isFinite(p[1]) && p[1]>0);
    S.hist[key] = {pts, at:Date.now(), err:false, loading:false};
  } catch(e){ S.hist[key] = {pts:h&&h.pts||null, at:Date.now(), err:true, loading:false}; }
  if (r==="D" && c===cur) renderPrices();
  renderChart();
}
function histPts(r, c){
  const h = S.hist[r+"|"+c]; if (!h || !h.pts || !h.pts.length) return null;
  const g = c===cur ? gramCur() : null, L = h.pts[h.pts.length-1][1];
  const k = (g && g/L > .95 && g/L < 1.05) ? g/L : 1;
  const pts = h.pts.map(p=>[p[0], p[1]*k]); if (g) pts.push([Date.now(), g]); return pts;
}
/* market hours (New York time): Sun 18:00 – Fri 17:00, daily break 17:00–18:00 */
function nyParts(d){ const f = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",hour12:false}).formatToParts(d);
  return { wd:f.find(p=>p.type==="weekday").value, h:+f.find(p=>p.type==="hour").value % 24 }; }
function marketOpen(d){ const {wd,h} = nyParts(d); if (wd==="Sat") return false; if (wd==="Sun") return h>=18; if (wd==="Fri") return h<17; return h!==17; }
function nextOpen(){ let d = new Date(); d.setMinutes(0,0,0); for (let i=0;i<24*4;i++){ d = new Date(d.getTime()+36e5); if (marketOpen(d)) return d; } return null; }

/* chart */
const cv = $("chart"), box = $("chartBox"); let chartGeom = null;
function renderChart(){
  if ($("v-home").hidden) return;
  const pts = histPts(S.range, cur), h = S.hist[S.range+"|"+cur], msg = $("chartMsg");
  const W = box.clientWidth, H = box.clientHeight, dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*dpr; cv.height = H*dpr; const x = cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  if (!pts || pts.length<2){ msg.textContent = h && h.err ? t("chartErr") : t("chartLoad"); msg.hidden = false; chartGeom = null; return; }
  msg.hidden = true;
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  const padL = 8, padR = 8, padT = 22, padB = 26;
  const t0 = pts[0][0], t1 = pts[pts.length-1][0];
  let lo = Infinity, hi = -Infinity; pts.forEach(p=>{ lo = Math.min(lo,p[1]); hi = Math.max(hi,p[1]); });
  const span = (hi-lo) || hi*0.01; const ylo = lo - span*.12, yhi = hi + span*.12;
  const X = tt => padL + (tt-t0)/(t1-t0||1)*(W-padL-padR), Y = v => padT + (1-(v-ylo)/(yhi-ylo))*(H-padT-padB);
  // grid
  x.strokeStyle = col("--rule"); x.lineWidth = 1; x.font = "11px " + col("--font"); x.fillStyle = col("--muted");
  for (let i=0;i<=3;i++){ const yy = padT + i*(H-padT-padB)/3; x.beginPath(); x.moveTo(padL,yy); x.lineTo(W-padR,yy); x.stroke(); }
  // area + line
  const up = pts[pts.length-1][1] >= pts[0][1];
  const g = x.createLinearGradient(0,padT,0,H-padB); const gc = col("--gold-2");
  g.addColorStop(0, gc+"55"); g.addColorStop(1, gc+"00");
  x.beginPath(); pts.forEach((p,i)=> i ? x.lineTo(X(p[0]),Y(p[1])) : x.moveTo(X(p[0]),Y(p[1]))); x.lineTo(X(t1),H-padB); x.lineTo(X(t0),H-padB); x.closePath(); x.fillStyle = g; x.fill();
  x.beginPath(); pts.forEach((p,i)=> i ? x.lineTo(X(p[0]),Y(p[1])) : x.moveTo(X(p[0]),Y(p[1]))); x.strokeStyle = col("--gold"); x.lineWidth = 2; x.lineJoin = "round"; x.stroke();
  // labels: high / low / change
  const iHi = pts.reduce((a,p,i)=> p[1]>pts[a][1]?i:a, 0), iLo = pts.reduce((a,p,i)=> p[1]<pts[a][1]?i:a, 0);
  x.fillStyle = col("--muted"); x.textBaseline = "bottom";
  const lab = (i, txt, above) => { const px = X(pts[i][0]), py = Y(pts[i][1]); x.textAlign = px < W*.15 ? "left" : px > W*.85 ? "right" : "center"; x.textBaseline = above ? "bottom" : "top"; x.fillText(txt, px, above ? py-6 : py+6); };
  lab(iHi, "▲ " + money(pts[iHi][1]), true); lab(iLo, "▼ " + money(pts[iLo][1]), false);
  // time axis
  x.textBaseline = "alphabetic"; x.fillStyle = col("--muted");
  const fmt = S.range==="D" ? {hour:"2-digit",minute:"2-digit"} : (S.range==="W"||S.range==="M") ? {day:"numeric",month:"short"} : {month:"short",year:"2-digit"};
  for (let i=0;i<=4;i++){ const tt = t0 + (t1-t0)*i/4; x.textAlign = i===0?"left":i===4?"right":"center"; x.fillText(new Date(tt).toLocaleString(loc(), fmt), X(tt), H-6); }
  // change chip in title area
  const ch = (pts[pts.length-1][1]/pts[0][1]-1)*100;
  x.textAlign = "left"; x.textBaseline = "top"; x.font = "600 12px " + col("--font"); x.fillStyle = up ? col("--up") : col("--down");
  x.fillText(pct(ch) + " " + t("inRange"), padL, 2);
  chartGeom = {pts, X, Y, W};
}
function onHover(ev){
  if (!chartGeom) return; const r = box.getBoundingClientRect(), mx = ev.clientX - r.left, {pts, X, Y} = chartGeom;
  let best = 0, bd = Infinity; pts.forEach((p,i)=>{ const d = Math.abs(X(p[0])-mx); if (d<bd){ bd=d; best=i; } });
  const p = pts[best], tip = $("tip"); tip.hidden = false;
  const fmt = S.range==="D"||S.range==="W" ? {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"} : {day:"numeric",month:"short",year:"numeric"};
  tip.textContent = money(p[1]) + " · " + new Date(p[0]).toLocaleString(loc(), fmt);
  tip.style.left = Math.max(70, Math.min(r.width-70, X(p[0]))) + "px"; tip.style.top = Y(p[1]) + "px";
}
box.addEventListener("pointermove", onHover); box.addEventListener("pointerleave", ()=> $("tip").hidden = true);
window.addEventListener("resize", ()=> renderChart());

// buy/sell in %, store in % per year, min = minimum storage per year in EUR (converted), freq: m=monthly, y=yearly, o=once
const ROUTES_DEF = [
  {id:"etc",   buy:.5, sell:.5, store:.25, min:0},
  {id:"app",   buy:.75, sell:.75, store:0, min:0},
  {id:"vault", buy:.5, sell:.5, store:.15, min:45},
  {id:"plan",  buy:3, sell:2, store:.6, min:0},
  {id:"coin",  buy:4, sell:2, store:0, min:0, freq:"y"},
  {id:"gram",  buy:15, sell:5, store:0, min:0},
];
let ROUTES = JSON.parse(JSON.stringify(ROUTES_DEF));
try { const s = JSON.parse(localStorage.getItem("valoro-cost")||"null"); if (s && Array.isArray(s.r) && s.r.length===ROUTES_DEF.length) ROUTES = s.r; if (s && s.mode){ $("cMode").value = s.mode; $("cAmt").value = s.amt; $("cYears").value = s.years; } } catch(e){}
const saveC = () => { try { localStorage.setItem("valoro-cost", JSON.stringify({r:ROUTES, mode:$("cMode").value, amt:$("cAmt").value, years:$("cYears").value})); } catch(e){} };
function simulate(rt, mode, amt, years){
  const months = Math.round(years*12); let gold = 0 /* value in money, price constant */, cash = 0, paid = 0;
  const minMonthly = (rt.min||0) * (S.rates ? S.rates[cur] : 1) / 12;
  const once = mode==="o"; const isCoinYearly = rt.freq==="y" && !once;
  const buy = (money) => { gold += money / (1 + rt.buy/100); };
  for (let m=0; m<months; m++){
    if (once){ if (m===0){ paid += amt; buy(amt); } }
    else { paid += amt; if (isCoinYearly){ cash += amt; if ((m+1)%12===0){ buy(cash); cash = 0; } } else buy(amt); }
    if (gold>0){ const fee = Math.max(gold * rt.store/100/12, minMonthly); gold = Math.max(0, gold - fee); }
  }
  if (cash>0){ buy(cash); cash = 0; }   // remaining savings for the yearly coin bought at the end
  const end = gold * (1 - rt.sell/100);
  return {paid, end, cost: paid - end};
}
function renderCost(){
  const mode = $("cMode").value, amt = parseNum($("cAmt").value), years = Math.min(50, Math.max(1, Math.round(parseNum($("cYears").value)||0)));
  $("cAmtL").textContent = t(mode==="m"?"costAmtM":"costAmtO", cur);
  const ok = isFinite(amt) && amt>0;
  $("cHead").textContent = t("costHead", years);
  if (!ok){ $("cBars").innerHTML = ""; $("cInvested").textContent = ""; return; }
  const list = ROUTES.map(rt=>{ const id = (rt.id==="coin" && mode==="o") ? "coin_once" : rt.id; return {rt, id, ...simulate(rt, mode, amt, years)}; }).sort((a,b)=>a.cost-b.cost);
  const max = Math.max(...list.map(l=>l.cost), 1);
  $("cInvested").textContent = t("costInvested", money(list[0].paid, 0));
  $("cBars").innerHTML = list.map((l,i)=>`<div class="brow${i===0?" best":""}">
      <div class="lbl"><b>${t("r_"+l.id)}${i===0?`<span class="tag best">${t("costBest")}</span>`:""}</b><span>${t("r_"+l.id+"_d")}</span></div>
      <div class="track"><i style="width:${Math.max(2, l.cost/max*100)}%"></i></div>
      <div class="val">${money(l.cost, 0)}<small>${numf(l.cost/l.paid*100,1)}% · ${t("costKeep", money(l.end, 0))}</small></div></div>`).join("");
  saveC();
}

  $("cTable").innerHTML = `<thead><tr><th>${t("cMethod")}</th><th class="r">${t("cBuy")} (%)</th><th class="r">${t("cSell")} (%)</th><th class="r">${t("cStore")} (%)</th><th class="r">${t("cMin")} (€)</th></tr></thead><tbody>` +
    ROUTES.map((rt,i)=>`<tr><td>${t("r_"+rt.id)}</td>${["buy","sell","store","min"].map(f=>`<td class="r"><input class="num" data-ri="${i}" data-rf="${f}" inputmode="decimal" value="${numf(rt[f], f==="min"?0:2)}"></td>`).join("")}</tr>`).join("") + "</tbody>";
}

let taxC = lang==="nl" ? "NL" : lang==="en" && cur==="GBP" ? "UK" : "DE";
const iso = d => d.toISOString().slice(0,10);
{ const now = new Date(); const b = new Date(now); b.setMonth(b.getMonth()-8); $("tBuyD").value = iso(b); $("tSellD").value = iso(now); }
function addYear(d){ const x = new Date(d); x.setFullYear(x.getFullYear()+1); return x; }
function renderTax(){
  $("taxDE").hidden = taxC!=="DE"; $("taxNL").hidden = taxC!=="NL"; $("taxUK").hidden = taxC!=="UK";
  if (taxC!=="DE") return;
  const etf = $("tProd").value==="etf";
  $("tOtherL").hidden = etf; $("tRateL").hidden = etf; $("tAllowL").hidden = !etf;
  const bd = new Date($("tBuyD").value+"T12:00:00"), sd = new Date($("tSellD").value+"T12:00:00");
  const ba = parseNum($("tBuyA").value), sa = parseNum($("tSellA").value), other = parseNum($("tOther").value)||0, rate = parseNum($("tRate").value), allow = Math.max(0, parseNum($("tAllow").value)||0);
  const eur = v => moneyIn(v, "EUR");
  const kv = []; let verdict = "—", expl = "";
  if (isNaN(bd) || isNaN(sd) || sd < bd || !isFinite(ba) || !isFinite(sa)){ $("tVerdict").textContent = "—"; $("tKv").innerHTML = ""; $("tExplain").textContent = t("tExplDates"); return; }
  const days = Math.round((sd-bd)/864e5), gain = sa-ba, freeFrom = new Date(addYear(bd).getTime()+864e5);
  kv.push([t("tHold"), t("tDays", days)], [t("tGain"), eur(gain)]);
  let tax = 0;
  if (gain <= 0){ verdict = t("tLoss"); expl = t("tExplLoss"); }
  else if (etf){ const base = Math.max(0, gain - allow); tax = base * .26375; verdict = tax>0 ? t("tTaxed", eur(tax)) : t("tFree"); expl = t("tExplEtf"); }
  else if (sd > addYear(bd)){ verdict = t("tFree"); expl = t("tExplFree"); }
  else if (gain + Math.max(0, other) < 1000){ verdict = t("tFree"); expl = t("tExplUnder"); kv.push([t("tFreeFrom"), freeFrom.toLocaleDateString(loc())]); }
  else { tax = gain * (isFinite(rate) ? Math.min(45, Math.max(0, rate)) : 30) / 100; verdict = t("tTaxed", eur(tax)); expl = t("tExplTax"); kv.push([t("tFreeFrom"), freeFrom.toLocaleDateString(loc())]); }
  kv.push([t("tNet"), eur(sa - tax)]);
  $("tVerdict").textContent = verdict; $("tVerdict").className = "verdict " + (tax>0 ? "down" : "up");
  $("tKv").innerHTML = kv.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("tExplain").textContent = expl;
}
["tProd","tBuyD","tSellD","tBuyA","tSellA","tOther","tRate","tAllow"].forEach(id=> $(id).addEventListener("input", renderTax));
$("tProd").addEventListener("change", renderTax);

/* ---------------- news ---------------- */
const NEWS_URLS = ["https://raw.githubusercontent.com/klcfurkan/goudprijs/data/news.json", "../news.json"];
let newsAt = 0;
async function loadNews(force){
  if (!force && Date.now()-newsAt < 3e5 && S.news) { renderNews(); return; }
  for (const u of NEWS_URLS){ try { const j = await getJSON(u + (u.startsWith("http") ? "?t="+Math.floor(Date.now()/6e4) : "")); if (j && Array.isArray(j.items)){ S.news = j; S.newsErr = false; newsAt = Date.now(); break; } } catch(e){ S.newsErr = true; } }
  renderNews();
}
function ago(sec){ const d = Date.now()/1000 - sec, rtf = new Intl.RelativeTimeFormat(loc(), {numeric:"auto"});
  if (d<3600) return rtf.format(-Math.max(1, Math.round(d/60)), "minute"); if (d<86400) return rtf.format(-Math.round(d/3600), "hour"); return rtf.format(-Math.round(d/86400), "day"); }
function renderNews(){
  const cats = ["all","gold","rates","economy","currency","conflict"];
  $("nFilters").innerHTML = cats.map(c=>`<button class="chip" data-nc="${c}" aria-pressed="${c===S.newsCat}">${c==="all"?t("nAll"):t("cat_"+c)}</button>`).join("");
  if (!S.news){ $("nList").innerHTML = `<p class="muted">${S.newsErr ? t("nErr") : t("loading")}</p>`; $("nUpd").textContent = ""; return; }
  const items = S.news.items.filter(i=> S.newsCat==="all" || i.cat===S.newsCat).sort((a,b)=>b.ts-a.ts);
  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  $("nList").innerHTML = items.length ? items.map(i=>`<a href="${esc(i.u)}" target="_blank" rel="noopener"><b>${esc(i.t)}</b><span class="meta"><span class="cat">${T["cat_"+i.cat] ? t("cat_"+i.cat) : esc(i.cat)}</span><span>${esc(i.s)}</span><span>${ago(i.ts)}</span><span>${String(i.lang||"").toUpperCase()}</span></span></a>`).join("") : `<p class="muted">${t("nEmpty")}</p>`;
  $("nUpd").textContent = S.news.updated ? t("nUpd", ago(S.news.updated)) : "";
}

/* ---------------- glue ---------------- */
function renderAllTools(){ renderValue(); renderCost(); renderBuy(); }
function renderEverything(){ renderPrices(); renderChart(); buildValue(); buildCostTable(); renderCost(); renderTax(); renderBuy(); renderNews(); }
applyTexts(); buildValue(); buildCostTable(); renderCost(); renderTax(); renderBuy(); route();
(async()=>{ await updateFx(); tries++; await updateMetals(); updateOther(); loadHist("D", cur); if (S.range!=="D") loadHist(S.range, cur); })();
setInterval(()=>{ tries++; updateMetals(); }, 15000);
setInterval(updateFx, 10*60*1000);
setInterval(updateOther, 60*1000);
setInterval(()=>{ loadHist("D", cur); loadHist(S.range, cur); }, 60*1000);
setInterval(()=>{ renderPrices(); if (currentView()==="news") loadNews(); }, 60*1000);
})();
</script>
